shape = "hexagon"
size = 2.5
deps = ["all_foods", "all_mobs", "catalog_scanner", "pattern_schematics", "chronicle_complete"]
tasks = [
	{ type = "item", item = "minecraft:beacon", count = 16 },
]
rewards = [
	{ type = "xp", xp = 300 },
	{ type = "toast" },
]

# ================= 追加：无尽纪元能做的更大的事（2026-09-22）=================
# 本章的定位是「毕业之后还能做什么更大的事」，所以这一整段都挂在
# `endless_engine`（无尽工程 · 其一）之后 —— 它不是新的终点，是终点之后的路。
#
# **与 `88-legacy` 的硬边界**（用户明说：85 讲「还能做什么更大的事」，
# 88 讲「怎么记住和交接」）：本段**不写**碑林、史册、名人堂、归档、交接文档。
# 这些内容一律留在 `88-legacy`。原章里既有的 `epitaph_each_era` 与
# `chronicle_complete` 属于历史遗留，本轮不动它们。
#
# 判据用到的 mod（逐个核过 id）：
#   · `create`：机械动力合成器 / 打包机 / 仓储链接站 / 工厂仪表 / 展示板 / 动力臂。
#   · `create_hypertube`：超级管道（点对点高速通道）。
#   · `railways`：列车轨道（下界干线的实物）。
#   · `waystones`：传送石与传送门（据点之间的回程）。
#   · `undeadnights`：尸潮僵尸的掉落物（尸潮夜真的打过一场的证据）。
#   · 原版进度：11 条收集类进度（家畜 / 猫 / 狼 / 药水 / 效果 / 锻纹 / 陶片 / 蛙明灯 / 满配信标）。

