	"按你的产业需要去配，不必一次配齐 —— 但缺了哪个，那类物资就只能玩家自己干。",
]
icon = "minecraft:composter"
shape = "pentagon"
size = 2.0
deps = ["p_beds"]
tasks = [
	{ type = "item", item = "minecraft:composter" },
]

