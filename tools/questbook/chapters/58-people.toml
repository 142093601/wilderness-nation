# ---------------- 簇 3：口粮与繁衍 ----------------

[[quest]]
name = "p_bread_line"
title = "面包管够"
desc = [
	"村民繁殖要食物，玩家也要。**面包是最省事的那一种**：三个麦子一个包。",
]
icon = "minecraft:bread"
shape = "pentagon"
size = 2.0
deps = ["p_job_farm"]
tasks = [
	{ type = "item", item = "minecraft:bread", count = 32 },
]

[[quest]]
name = "p_carrot_field"
title = "胡萝卜田"
desc = [
	"胡萝卜既能喂人也能喂村民，还能喂兔子。它比小麦更「一条顶三条用」。",
]
icon = "minecraft:carrot"
shape = "square"
deps = ["p_bread_line"]
tasks = [
	{ type = "item", item = "minecraft:carrot", count = 32 },
]

[[quest]]
name = "p_growth"
title = "人口增长"
desc = [
	"给两个村民足够的食物，他们就会生出下一代 —— 这是**唯一**的人口增长方式。",
	"所以「粮食储备」不是后勤细节，是国策。",
]
icon = "minecraft:wheat"
shape = "rsquare"
deps = ["p_bread_line", "p_carrot_field"]
tasks = [
	{ type = "item", item = "minecraft:wheat", count = 24 },
	{ type = "item", item = "minecraft:carrot", count = 24 },
]

[[quest]]
name = "p_hay_store"
title = "公共粮囤"
desc = [
	"干草块是压缩粮：九个麦子压一格。全队的口粮应该有**一个地方**放着。",
]
icon = "minecraft:hay_block"
shape = "square"
deps = ["p_growth"]
tasks = [
	{ type = "item", item = "minecraft:hay_block", count = 16 },
]

# ---------------- 簇 4：治安与公共事务 ----------------

[[quest]]
name = "p_iron_golem"
title = "铁傀儡"
desc = [
	"四个铁块加一个南瓜：这是**不需要玩家在线**的治安力量。",
	"它挡不住尸潮，但挡得住夜里的零散怪 —— 有它之后你才敢离开据点出远门。",
]
icon = "minecraft:carved_pumpkin"
shape = "rsquare"
deps = ["p_jobs_all"]
tasks = [
	{ type = "item", item = "minecraft:carved_pumpkin" },
	{ type = "item", item = "minecraft:iron_block", count = 4 },
]

[[quest]]
name = "p_watch"
title = "常驻岗哨"
desc = [
	"至少两个铁傀儡，才算「夜里有人看着」；一个会被逐个引开。",
]
icon = "minecraft:iron_block"
shape = "circle"
size = 1.2
deps = ["p_iron_golem"]
tasks = [
	{ type = "item", item = "minecraft:iron_block", count = 8 },
]

[[quest]]
name = "p_well"
title = "水井"
desc = [
	"居民区要有**不用跑远**的水：一口井（水源 + 炼药锅）解决喝、洗、灭火三件事。",
]
icon = "minecraft:water_bucket"
shape = "circle"
size = 1.2
deps = ["p_bell"]
tasks = [
	{ type = "item", item = "minecraft:water_bucket", count = 2 },
	{ type = "item", item = "minecraft:stone_bricks", count = 16 },
]

[[quest]]
name = "p_medicine"
title = "药与治疗"
desc = [
	"金苹果是最早能拿到的「稳定治疗」：八个金锭一个果，值得为它留一条金矿线。",
]
icon = "minecraft:golden_apple"
shape = "circle"
size = 1.2
deps = ["p_job_cleric"]
tasks = [
	{ type = "item", item = "minecraft:golden_apple", count = 4 },
]

[[quest]]
name = "p_school"
title = "学堂"
desc = [
	"书架 + 讲台：既是附魔的产能基础，也是「这里有人在读书」的标志。",
]
icon = "minecraft:bookshelf"
shape = "rsquare"
deps = ["p_job_librarian"]
tasks = [
	{ type = "item", item = "minecraft:bookshelf", count = 15 },
	{ type = "item", item = "minecraft:lectern" },
]

[[quest]]
name = "p_register"
title = "户籍登记"
desc = [
	"命名牌 + 告示牌：谁负责什么，写在墙上。",
	"国家一旦超过五六个人，**口头分工就开始失效** —— 这一条是在为那个时刻做准备。",
]
icon = "minecraft:name_tag"
shape = "circle"
size = 1.2
deps = ["p_jobs_all"]
tasks = [
	{ type = "item", item = "minecraft:name_tag", count = 4 },
	{ type = "item", item = "minecraft:oak_sign", count = 8 },
]

[[quest]]
name = "p_graveyard"
title = "墓园"
desc = [
	"按规矩埋人，比把人埋在门口体面。石砖围墙圈一块地，插牌记名。",
	"（碑林那一章会把「记名」这件事做成制度。）",
]
icon = "minecraft:stone_brick_wall"
shape = "circle"
size = 1.2
deps = ["p_register"]
tasks = [
	{ type = "item", item = "minecraft:stone_brick_wall", count = 24 },
	{ type = "item", item = "minecraft:soul_lantern", count = 4 },
]

[[quest]]
name = "p_people_done"
title = "这是一座城了"
desc = [
	"有居民、有职业、有粮、有治安、有记录 —— 从这一条开始，",
	"「文明」章里那些大工程才不是空房子。",
]
icon = "minecraft:bell"
shape = "hexagon"
size = 2.5
deps = ["p_lanterns", "p_hay_store", "p_watch", "p_well", "p_medicine", "p_school", "p_graveyard"]
tasks = [
	{ type = "item", item = "minecraft:emerald_block", count = 8 },
]
rewards = [
	{ type = "xp", xp = 90 },
	{ type = "toast" },
]
