# 编年 · 人口与民生
#
# 这一章补的是「城」与「国」之间缺的那一层
# ----------------------------------------
# 前面几章都在讲**造东西**（基建、材料、机械），后面几章讲**文明规模**。
# 中间少了一个问题：**这些东西是给谁用的**。
# 一个只有玩家、没有居民的据点不叫国家；而「让每个职业都有人干」这件事
# 恰好是一张**有明确实物判据**的清单（15 种工作站方块），非常适合做任务。
#
# 与其它章的分工（边界写清楚，免得写重）：
#   · 立国     = 圈地、公共仓库、议事厅、粮仓起步（**设施**）
#   · 本章     = 居民本身：床位、职业、繁衍、治安、配给（**人**）
#   · 农牧章   = mod 家族视角（Farming for Blockheads / More Villagers / Naturalist）
#                —— **More Villagers 新增的职业不在本章**，在本章只做原版 15 种
#
# 判据：工作站、床、粮、铁傀儡的**实物**。没有一条 checkmark。

key = "people"
title = "人口与民生"
subtitle = "让城里真的有居民，而不是一排空房子"
group = "chronicle"
icon = "minecraft:bell"
order_index = 7

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：把人留下来 ----------------

[[quest]]
name = "p_beds"
title = "床位够住"
desc = [
	"村民认床：晚上没床他就走。**床数 = 人口上限**，这是最硬的约束。",
	"想留住 8 个人，先摆 8 张床。",
]
icon = "minecraft:white_bed"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "minecraft:white_bed", count = 8 },
]

[[quest]]
name = "p_houses"
title = "给每户一间屋"
desc = [
	"有墙有门有屋顶，才算一间屋。露天摆床不算 —— 村民会认，但雷雨天会出事。",
]
icon = "minecraft:oak_door"
shape = "rsquare"
deps = ["p_beds"]
tasks = [
	{ type = "item", item = "minecraft:oak_door", count = 8 },
]

[[quest]]
name = "p_lanterns"
title = "村里不黑"
desc = [
	"居民区不留黑块：既是为了不刷怪，也是为了**村民晚上敢走动**。",
]
icon = "minecraft:lantern"
shape = "square"
deps = ["p_houses"]
tasks = [
	{ type = "item", item = "minecraft:lantern", count = 12 },
]

[[quest]]
name = "p_bell"
title = "村钟"
desc = [
	"钟是村子的中心点：敲一下，附近的居民会往这里聚。",
	"它也是「这个聚落已经成型」最直观的标志 —— 放在广场上。",
]
icon = "minecraft:bell"
shape = "rsquare"
deps = ["p_houses"]
tasks = [
	{ type = "item", item = "minecraft:bell" },
]

