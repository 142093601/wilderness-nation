	"一条线不算自动化，三条才算「基建成型」。",
	"到这一步，你们的时间才真正开始用在建造上，而不是搬东西。",
]
icon = "create:mechanical_crafter"
shape = "rsquare"
deps = ["first_automation"]
tasks = [
	{ type = "advancement", advancement = "create:mechanical_crafter" },
]

[[quest]]
name = "stress_network"
title = "通电"
