# ================= 追加：市政工程（2026-09-22 · 第二轮）=================
# 这一轮补的是「工程类型」与「城市尺度的系统」，不是新的机器。
# 原章已有：路通四邻 / 水塔·灌溉·排水 / 照明 / 生活设施 / 材料产线 / 交通延伸 / 储备。
# 本轮新增九段：水利工程 · 道路分级 · 桥梁类型 · 排水防洪 · 交通组织 · 全城配电 ·
# 市政接入 · 应急与边界 · 施工组织。
#
# 判据用到的 mod（都是实物，逐个核过 id）：
#   · `tfmg`（The Factory Must Grow）：沥青与钢筋混凝土的路面、钢管与工业管道、
#     电线杆·变压器·电压表（全城配电这一层的实物）。
#     **边界**：TFMG 的加工链（焦炉→高炉→炼钢→分馏）在 `42-materials` 的簇 6，
#     本章只用它当「路铺成了、电送到了」的验收物，不写它怎么做出来。
#   · `mcwpaths`：路面铺装（人行道 / 台阶 / 坡道）的实物。
#   · `mcwbridges`：桥与桥墩、索桥、钢桥的实物。
#     **边界**：`100-cat-building` 讲这些构件有哪些可选；本章讲「哪一处要建、建成什么样」。
#   · `create`：只借流体管道当暗管，不碰机器内部工序（那是 `60-create` / `62-logistics`）。
#
# 与 `80-civilization` 的分工：本章是**时代 2 的工程目标**（城还没成型时要先有什么），
# 那一章是**文明时代的城市形态**（分区、天际线、公共设施机构化）。

