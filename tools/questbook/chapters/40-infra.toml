# 基建（时代 2 · infra）
#
# 时代定义：`eras.json` → id=infra, name=基建, durationHours=50, coefficient=1.30
# unlocks: intel_station / declaration（情报站在这个时代解锁——与邦交章对应）
# 主菜：**自动化产线**（DESIGN.md §17.3）
#
# 判据来源：Create 自己的进度 + Create/原版物品 + 原版统计。
# Create 是唯一一个"每个机器都有进度"的大 mod（实测 1150 条），所以这一章几乎全自动可判。

key = "infra"
title = "基建"
subtitle = "路通四邻，第一件事不用人管"
group = "chronicle"
icon = "create:cogwheel"
order_index = 4
grid = { step = 1.5, row_h = 1.75 }

# ---------------- 国策主线 ----------------

[[quest]]
name = "roads_500"
title = "路通四邻"
desc = [
	"主路从城里铺出去 500 格以上，连到最近的水源、林地或别人家。",
]
icon = "minecraft:dirt_path"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "minecraft:dirt_path", count = 64 },
]

[[quest]]
name = "first_automation"
title = "第一件事不用人管"
desc = [
	"选一件事（原木、圆石、食物、熔炼任选），做成「原料进、成品出、中间没有人」。",
	"Create 会给你一个进度——它就是这条的判据。",
]
