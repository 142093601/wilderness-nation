	{ type = "item", item = "minecraft:stone_bricks", count = 32 },
]
rewards = [
	{ type = "command", command = "/statecraft accelerate" },
	{ type = "xp", xp = 120 },
	{ type = "toast" },
]

# ================= 追加：基础服务与材料产线（2026-09-22）=================
# 编排思路：这一章原先是「国策里程碑」，缺的是把它们之间的日常设施补齐。
# 新增六段：供水系统 / 照明与安全 / 生活设施 / 材料产线 / 交通延伸 / 批量与储备。
# 与 100-cat-building、130-cat-storage 分工：那两章讲「有哪些 mod 能用」，
# 这里讲「城里真要用起来的那几样」。

[[quest]]
name = "water_tower"
title = "水塔"
desc = [
	"主城要有稳定的取水点，不能靠人一桶桶拎。",
	"泵 + 储罐 + 管道，把水从水源送到用水处——这是后面所有流体产线的样板。",
]
icon = "minecraft:cauldron"
shape = "circle"
size = 1.2
deps = ["roads_500"]
tasks = [
	{ type = "item", item = "create:fluid_tank", count = 2 },
	{ type = "item", item = "create:mechanical_pump", count = 1 },
]

[[quest]]
name = "irrigation"
