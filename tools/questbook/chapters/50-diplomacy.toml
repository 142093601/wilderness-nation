# 邦交 · Statecraft 国家线
#
# 这一章有一处**与其它章不同的取舍**，先说清楚
# --------------------------------------------
# 实测：`statecraft-0.1.0.jar` **不提供任何 advancement，也没有自定义 statistic**
# （`advancements=0`）。所以"读完一份详报""标好一个国家""夺下一座城"这些**动作**，
# 在 FTB Quests 里**没有信号源**。
#
# 而 `PLAN-questbook.md` 的根本约束 3 明确写着：**任务不当门闸，除了时代钥匙**；
# 约束 1 写着：**判据必须落在游戏事实上**。
# 把这两条放在一起，结论是：**邦交章不该为了凑数塞一批判不了的任务**——
# 那既违反约束 1（假判据），也违反约束 3（不是门闸的东西不必成为任务）。
#
# 所以这一章只放**有真实判据**的那些（锚点方块 / 物资 / 击杀 / 原版进度），
# 其余的流程靠**任务正文**引导（文字是"导向"，不必是"任务"）。
# 每一章里那 1~2 条真的没有信号的，进 checkmark 例外清单并写明理由。
#
# 判据来源：`buildings.json` 实测定死了情报站的锚点方块与门槛
# （anchorBlock=minecraft:lectern · requireRoof · minEnclosurePercent=60 · minVolume=12 · requireClaim=true）

key = "diplomacy"
title = "邦交"
subtitle = "世界不只有你们：先看见邻邦，再决定怎么打交道"
group = "diplomacy"
icon = "minecraft:lectern"
order_index = 20
grid = { step = 1.5, row_h = 1.75 }

# ---------------- 开场：世界不是空的 ----------------

[[quest]]
name = "first_sight"
title = "初见邻邦"
desc = [
	"这个世界本来就有别人。走到某个国家的都城 512 格以内，就算「接触」过了",
	"——接触之后，情报册上才会出现它的名字。",
	"（这条是 mod 的实际判定半径，不是我设的数。）",
]
icon = "minecraft:compass"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "stat", stat = "minecraft:walk_one_cm", value = 15000 },
]

[[quest]]
name = "read_the_book"
title = "翻开情报册"
desc = [
	"情报册里是已接触国家的名单：名字、方位、态度。",
	"第一档只能看这些，想看更多要建情报站（后面几步）。",
	"⚠️ 「读了册子」没有可检测信号（模组不提供统计），所以这一步自己确认。",
]
icon = "minecraft:book"
shape = "rsquare"
deps = ["first_sight"]
tasks = [
	{ type = "checkmark" },
]

# ---------------- 情报站：一条真实的建造链 ----------------

[[quest]]
name = "buy_blueprint"
title = "买到图纸"
desc = [
	"情报站不是凭空盖的：要先拿到它的图纸。",
	"图纸要花钱（`blueprintPrice: 64`）——先把国库攒起来。",
]
icon = "minecraft:emerald"
shape = "rsquare"
deps = ["read_the_book"]
tasks = [
	{ type = "item", item = "minecraft:emerald", count = 64 },
]

[[quest]]
name = "site_the_station"
title = "立起讲台"
desc = [
	"情报站的锚点是**讲台**（`minecraft:lectern`）——把它放在你要当情报站的那个位置。",
	"注意：这东西**必须在你们的领地里**（建筑条件要求 requireClaim），不然登记不上。",
]
icon = "minecraft:lectern"
shape = "rsquare"
deps = ["buy_blueprint"]
tasks = [
	{ type = "item", item = "minecraft:lectern" },
]

[[quest]]
name = "station_up"
title = "把站建起来"
desc = [
	"建筑条件（模组实测，不是我编的）：要有屋顶、围合度 ≥ 60%、内部体积 ≥ 12。",
	"围得太小的棚子不算——它要能真的住下一个文书。",
]
icon = "minecraft:bookshelf"
shape = "rsquare"
deps = ["site_the_station"]
tasks = [
	{ type = "item", item = "minecraft:bookshelf", count = 4 },
]

[[quest]]
name = "scribe_on_duty"
title = "文书就位"
desc = [
	"情报站没人就不转：给它绑一个**文书**（`scribe`）。",
	"绑好之后，外交与宣战才**有地方发起**——这两件事都要求在绑好村民的情报站 16 格内。",
]
icon = "minecraft:emerald_block"
shape = "rsquare"
deps = ["station_up"]
tasks = [
	{ type = "item", item = "minecraft:emerald_block" },
]

[[quest]]
name = "first_contact_list"
title = "认识天下"
desc = [
	"情报站建成后，册子里会填满各国的名号——不必跑遍地图就能开始外交。",
	"先把关着你们的邻国的详报读一遍。",
	"⚠️ 「读详报」没有信号源，这一步自己确认。",
]
icon = "minecraft:filled_map"
shape = "rsquare"
deps = ["scribe_on_duty"]
tasks = [
	{ type = "checkmark" },
]

# ---------------- 外交：能做，但判定不了 ----------------

[[quest]]
name = "first_diplomacy"
title = "第一次遣使"
desc = [
	"六个动作：宣战 · 求和 · 结盟 · 通商 · 求援 · 朝贡。",
	"发起的地方是情报站（宣战与朝贡要全服公告，也在这里）。",
	"⚠️ 这条**判不了**：模组不发进度也不记统计。做完自己确认。",
	"如果你想让它自动判定，需要 mod 侧给这些动作发信号——已记进待办。",
]
icon = "minecraft:writable_book"
shape = "circle"
size = 1.2
deps = ["first_contact_list"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "trade_with_them"
title = "通商"
desc = [
	"态度到 0 以上就能通商：去它的都城交易，双方国库都涨。",
	"「和村民做成交易」这件事原版有进度，所以这条能自动判。",
]
icon = "minecraft:emerald"
shape = "rsquare"
deps = ["first_contact_list"]
tasks = [
	{ type = "advancement", advancement = "minecraft:adventure/trade" },
]

# ---------------- 图纸：邦交的实用回报 ----------------

[[quest]]
name = "blueprints_from_them"
title = "把图纸买回来"
desc = [
	"图纸是这个包基建时代的核心资源，而情报站是稳定来源。",
	"攒够一批，别一张一张买。",
]
icon = "minecraft:paper"
shape = "rsquare"
deps = ["first_diplomacy"]
tasks = [
	{ type = "item", item = "minecraft:paper", count = 32 },
]

# ---------------- 终局：夺城 ----------------

[[quest]]
name = "war_footing"
title = "交战的资格"
desc = [
	"夺城不是想去就去的：目标国必须先被压到「可占领」（warScore 压制 + 军力低于阈值），",
	"而且要付代价。所以在谈夺城之前，先真的打过一仗。",
	"「袭击被触发」原版有统计，这条能自动判。",
]
icon = "minecraft:crossbow"
shape = "circle"
size = 1.2
deps = ["first_diplomacy"]
tasks = [
	{ type = "stat", stat = "minecraft:raid_trigger", value = 1 },
]

[[quest]]
name = "raid_and_hold"
title = "挡回去"
desc = [
	"它会来打你们——这是邦交线真正的压力来源。",
	"杀够 100 个，说明这一仗不是被平推的。",
]
icon = "minecraft:shield"
shape = "circle"
size = 1.2
deps = ["war_footing"]
tasks = [
	{ type = "kill", entity = "minecraft:zombie", value = 100 },
]

# ---------------- 情报站深化：从「有一个站」到「有一张网」 ----------------
#
# 这 17 条是 2026-09-22 加厚时补的。原来的 13 条只讲"接触 → 建站 → 第一次外交 → 夺城"，
# 中间那一层（**情报本身怎么积累、怎么用**）是空的。
# 而 `52-treaty` / `54-conquest` 已经把"外交条款"与"攻城夺城"接走了，
# 所以这一章的定位收敛为：**看见 → 知道 → 用情报做事**。

[[quest]]
name = "station_upgrade"
title = "情报站升级"
desc = [
	"情报站不是建完就完了：升级后能看的档位更多、覆盖更远。",
	"升级要花的还是国库里的东西 —— 这也是「国库与营建」那一章为什么要单独存在。",
]
icon = "minecraft:chiseled_bookshelf"
shape = "rsquare"
deps = ["scribe_on_duty"]
tasks = [
	{ type = "item", item = "minecraft:chiseled_bookshelf", count = 2 },
	{ type = "item", item = "minecraft:emerald", count = 32 },
]

[[quest]]
name = "border_walk"
title = "沿着边界走一圈"
desc = [
	"地形是情报的一部分：哪边是河、哪边是山、哪边能过车。",
	"走完把结论标到地图上，别只留在自己脑子里。",
]
icon = "minecraft:leather_boots"
shape = "rsquare"
deps = ["station_upgrade"]
tasks = [
	{ type = "stat", stat = "minecraft:walk_one_cm", value = 120000 },
]

[[quest]]
name = "capital_on_map"
title = "把邻国都城标上图"
desc = [
	"地图上知道它在哪，比册子里写着「在东边」有用得多。",
]
icon = "minecraft:filled_map"
shape = "rsquare"
deps = ["station_upgrade"]
tasks = [
	{ type = "item", item = "minecraft:filled_map", count = 2 },
	{ type = "item", item = "minecraft:cartography_table" },
]

[[quest]]
name = "neighbor_dossier"
title = "邻国档案"
desc = [
	"一份档案记四件事：**它在哪、它多强、它缺什么、它跟谁有仇**。",
	"这四条决定了后面该通商、该结盟，还是该打。",
]
icon = "minecraft:written_book"
shape = "pentagon"
size = 2.0
deps = ["border_walk", "capital_on_map"]
tasks = [
	{ type = "item", item = "minecraft:written_book", count = 2 },
]

[[quest]]
name = "intel_grade"
title = "给情报分级"
desc = [
	"公开的贴墙上，机密的锁柜子里 —— 不分级的情报网等于没有。",
]
icon = "minecraft:barrel"
shape = "circle"
size = 1.2
deps = ["neighbor_dossier"]
tasks = [
	{ type = "item", item = "minecraft:barrel", count = 4 },
	{ type = "item", item = "minecraft:iron_door" },
]

[[quest]]
name = "envoy_post"
title = "派驻使节"
desc = [
	"常驻的使节比每次派人过去省事得多，也更容易发现对方的变化。",
	"游戏里它就是「在它附近有一间能住的屋子 + 一个人」。",
]
icon = "minecraft:lectern"
shape = "rsquare"
deps = ["neighbor_dossier"]
tasks = [
	{ type = "item", item = "minecraft:lectern" },
	{ type = "item", item = "minecraft:white_bed" },
]

[[quest]]
name = "border_outpost"
title = "边境哨所"
desc = [
	"哨所的作用不是打仗，是**早点知道**。放在你们和它之间那条路上。",
]
icon = "minecraft:scaffolding"
shape = "rsquare"
deps = ["border_walk"]
tasks = [
	{ type = "item", item = "minecraft:scaffolding", count = 16 },
	{ type = "item", item = "minecraft:lantern", count = 4 },
]

[[quest]]
name = "watchtower"
title = "瞭望塔"
desc = [
	"比哨所高一层就行：能看见对面有没有人在集结。",
]
icon = "minecraft:spyglass"
shape = "circle"
size = 1.2
deps = ["border_outpost"]
tasks = [
	{ type = "item", item = "minecraft:spyglass" },
	{ type = "item", item = "minecraft:stone_bricks", count = 32 },
]

[[quest]]
name = "courier_line"
title = "驿站与传信"
desc = [
	"情报的价值随时间衰减：**晚三天的消息基本没用**。",
	"沿途设驿站、备快马（鞍与干草块），是情报网的物理基础。",
]
icon = "minecraft:saddle"
shape = "rsquare"
deps = ["border_outpost"]
tasks = [
	{ type = "item", item = "minecraft:saddle", count = 2 },
	{ type = "item", item = "minecraft:hay_block", count = 4 },
]

[[quest]]
name = "trade_route_recon"
title = "侦察商路"
desc = [
	"通商之前先自己走一遍：路况、补给点、有没有劫道的。",
	"（真正「跑通商路」是 `52-treaty` 那一章的事，这里只做侦察。）",
]
icon = "minecraft:compass"
shape = "rsquare"
deps = ["border_walk"]
tasks = [
	{ type = "item", item = "minecraft:compass" },
	{ type = "item", item = "minecraft:bread", count = 8 },
]

[[quest]]
name = "informant"
title = "在它附近留个暗桩"
desc = [
	"最靠前的一双眼睛：一间小屋、一张床、一个讲台，够用了。",
]
icon = "minecraft:dark_oak_door"
shape = "circle"
size = 1.2
deps = ["envoy_post"]
tasks = [
	{ type = "item", item = "minecraft:dark_oak_door" },
	{ type = "item", item = "minecraft:white_bed" },
]

[[quest]]
name = "interrogate"
title = "问出话来"
desc = [
	"抓到的敌人嘴里有布防、有路线、有他们的打算。",
	"（用它做判据的是「抓到了人」这件事本身，不是「问出了什么」。）",
]
icon = "minecraft:lead"
shape = "circle"
size = 1.2
deps = ["station_upgrade"]
tasks = [
	{ type = "item", item = "minecraft:lead", count = 2 },
]

[[quest]]
name = "counter_intel"
title = "反情报"
desc = [
	"你们的情报站也会被人盯上：锁门、留人、别把册子摊在门口。",
]
icon = "minecraft:iron_trapdoor"
shape = "circle"
size = 1.2
deps = ["intel_grade"]
tasks = [
	{ type = "item", item = "minecraft:iron_trapdoor", count = 2 },
	{ type = "item", item = "minecraft:lever", count = 2 },
]

[[quest]]
name = "intel_network"
title = "情报网成型"
desc = [
	"站点、哨所、驿站、暗桩连成一条线之后，",
	"**你们对邻国的了解不再依赖谁碰巧路过**。",
]
icon = "minecraft:bell"
shape = "octagon"
size = 1.75
deps = ["watchtower", "courier_line", "informant", "counter_intel", "trade_route_recon"]
tasks = [
	{ type = "item", item = "minecraft:bell", count = 2 },
	{ type = "item", item = "minecraft:filled_map", count = 2 },
]

[[quest]]
name = "intel_briefing"
title = "向全队通报"
desc = [
	"情报要变成**共同知识**才有用：在议事厅讲一次，把结论贴上墙。",
]
icon = "minecraft:item_frame"
shape = "rsquare"
deps = ["intel_network"]
tasks = [
	{ type = "item", item = "minecraft:item_frame", count = 4 },
	{ type = "item", item = "minecraft:oak_sign", count = 4 },
]

[[quest]]
name = "scribe_supply"
title = "给文书供纸"
desc = [
	"情报站每天在消耗纸与墨 —— 断供的站等于关门。",
]
icon = "minecraft:paper"
shape = "square"
deps = ["station_upgrade"]
tasks = [
	{ type = "item", item = "minecraft:paper", count = 32 },
	{ type = "item", item = "minecraft:ink_sac", count = 4 },
]

[[quest]]
name = "green_eye"
title = "换个角度再看一次"
desc = [
	"同一个国家，从北边看和从南边看是两回事。",
	"这一条要的是**再走一趟**，不是新的东西 —— 所以判据是走路统计。",
]
icon = "minecraft:ender_pearl"
shape = "circle"
size = 1.2
deps = ["neighbor_dossier"]
tasks = [
	{ type = "stat", stat = "minecraft:walk_one_cm", value = 250000 },
]

[[quest]]
name = "take_the_city"
title = "夺下一座城"
desc = [
	"两件事同时做到才算：**插旗**（走到城中心的旗座按住 N 秒）+ **指挥官已死**。",
	"指挥官活着时守军会一直补员，所以实际节奏是「先斩首、再插旗」。",
	"⚠️ 这条判不了：模组不提供夺城成功事件，也不发进度。",
	"做完它会生成占领碑、把那座城记进你们的属地清单。",
]
icon = "minecraft:white_banner"
shape = "hexagon"
size = 2.5
deps = ["raid_and_hold", "blueprints_from_them"]
tasks = [
	{ type = "checkmark" },
]
rewards = [
	{ type = "xp", xp = 100 },
	{ type = "toast" },
]
