# 类目 · 性能与优化
#
# 本章的 mod（20 个）：
#   帧率       Embeddium · EntityCulling · More Culling · ImmediatelyFast ·
#              BadOptimizations · Dynamic FPS
#   内存与加载 FerriteCore · ModernFix · Noisium · ScalableLux · Chunky · Chunk Plan
#   服务器侧   Lithium · ServerCore · Packet Fixer · Connectivity · Clumps · Neruina
#   诊断       spark · Crash Assistant
#
# 与其它章的分工：
#   · 本章         = 跑不跑得动（帧率、内存、加载、服务端）
#   · 174-cat-client = 屏幕上的信息怎么读（Jade / BetterF3 / AppleSkin …）
#   · 178-cat-audio  = 音画与氛围
#
# ⚠️ 本章的判据来源（这是本章最特殊的地方）：
#   优化类 mod **全都没有可持有物品**。实测：`python tools/item_index.py --stats` 的
#   100 个命名空间里，没有 embeddium / lithium / ferritecore / modernfix / entityculling /
#   moreculling / badoptimizations / dynamicfps / immediatelyfast / scalablelux / noisium /
#   servercore / packetfixer / chunky / chunkplan / spark / clumps / neruina / connectivity /
#   crash-assistant 里的任何一个（其中若干项在 modlist.tsv 里还是 plan 状态）。
#   ⇒ mod 条目一律 checkmark，并在每条上方写明理由；
#     凡能落到「手上真的拿着某样东西」的流程条目，一律用实物判据（漏斗、命名牌、地图、
#     拉杆、书与笔、牌子、成书）。
#
# 目标数字的出处：DESIGN.md §12（TPS 常态 ≥19.5、袭击期 ≥15、MSPT ≤30ms、
#   常驻实体 ≤300、预生成核心区半径 1000 格、启动 ≤3 分钟、视距 6~8、模拟距离 4~6）。

key = "cat_perf"
title = "性能与优化"
subtitle = "跑得动才有后面：性能预算的玩家侧操作面"
group = "category"
icon = "minecraft:comparator"
order_index = 64

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：帧率 ----------------

[[quest]]
name = "p_optimized"
title = "这个包已经为你优化过了"
desc = [
	"包里内置了一整套性能 mod（渲染、内存、区块加载、实体剔除各一层），**默认全开**。",
	"你不需要做任何事——这一条只是让你知道「慢不一定是包的错」。",
	"⚠️ 性能 mod 没有物品接口（实测），所以这一条自检。",
]
icon = "minecraft:comparator"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "p_graphics"
title = "客户端画面设置"
desc = [
	"帧率低先调这三样（按收益排序）：渲染距离 → 模拟距离 → 阴影/云。",
	"这个包用的是 Embeddium 系渲染器，视频设置里的选项比原版多。",
]
icon = "minecraft:painting"
shape = "circle"
size = 1.2
deps = ["p_optimized"]
tasks = [
	{ type = "checkmark" },
]

