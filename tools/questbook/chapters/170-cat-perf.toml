# ---------------- 簇 4：诊断工具 ----------------

# checkmark：Crash Assistant 是客户端侧的崩溃报告解读界面，实测注册表无 crash_assistant
# 命名空间；它读的是崩溃报告文件，不是游戏内物品或统计。
[[quest]]
name = "p_crash_assistant"
title = "崩溃先交给它读：Crash Assistant"
desc = [
	"诊断工具是这一章的落点：前面几簇讲「装了什么」，这一簇讲「出事之后怎么查」。",
	"它的价值在崩溃那一刻——先看清是谁崩的，再决定删什么、退什么。",
]
icon = "minecraft:anvil"
shape = "pentagon"
size = 2.0
deps = ["p_optimized"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "p_first_question"
title = "先分清「卡」和「崩」"
desc = [
	"两个完全不同的问题，查法也不同：",
	"· **崩了** → 有崩溃报告，去 `crash-reports/` 找；报错里最上面那个 mod 通常就是原因",
	"· **卡了** → 没有崩溃报告，是性能问题；要看 TPS/MSPT，不是看日志",
	"把这两件事混起来，会让排查方向从一开始就错。",
]
icon = "minecraft:redstone_torch"
shape = "rsquare"
deps = ["p_optimized"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "p_spark"
title = "卡顿要看数据：spark"
desc = [
	"服务端卡：`/spark tps` 看 TPS、`/spark profiler start` 采一段，然后 `--stop` 出报告链接。",
	"单人卡：客户端 F3 看帧率，或 `/spark profiler --timeout 30` 采客户端。",
	"**不要靠感觉报「很卡」** —— 给一张 spark 报告，问题基本当场定位。",
]
icon = "minecraft:clock"
shape = "rsquare"
deps = ["p_first_question"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "p_tps"
title = "原版也能看服务端状态"
desc = [
	"没装 spark 也没关系：`/tick query` 会给出 P50 / P95 / P99 的 tick 耗时。",
	"设计里的性能预算就是 ms 级的（见 DESIGN.md §12），所以这个数字直接可比。",
]
icon = "minecraft:repeater"
shape = "circle"
size = 1.2
deps = ["p_spark"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "p_info_tools"
title = "信息怎么看"
desc = [
	"· **Jade**：指着方块显示它是什么（自动生效）",
	"· **BetterF3**：F3 信息更整齐，可按 F3+G 之外的方式自定义",
	"· **AppleSkin**：饥饿值与饱和度读数（种田党的命）",
	"· **JEI / EMI**：配方查询——本包用的是 JEI",
	"这些都是客户端界面 mod，没有物品判据，所以这一条自检。",
]
icon = "minecraft:book"
shape = "rsquare"
deps = ["p_optimized"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "p_report_log"
title = "把每次卡顿的结论记下来"
icon = "minecraft:writable_book"
shape = "circle"
size = 1.2
deps = ["p_spark"]
tasks = [
	{ type = "item", item = "minecraft:writable_book" },
]

[[quest]]
name = "p_budget_board"
title = "四项指标贴在议事厅"
desc = [
	"预算写在纸上才有人看：四项数字贴在议事厅，谁都能对着查。",
	"这一格是本章的收尾——以后每加一组 mod，都回到这里对一次账。",
]
icon = "minecraft:oak_sign"
shape = "octagon"
size = 1.75
deps = ["p_tps", "p_report_log"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 4 },
	{ type = "item", item = "minecraft:book", count = 2 },
]

[[quest]]
name = "p_done"
title = "把这一章记在心里就行"
desc = [
	"它没有奖励，也没有任务要交——出问题时回来翻一遍就够了。",
]
icon = "minecraft:knowledge_book"
shape = "hexagon"
size = 2.5
deps = ["p_tps", "p_graphics", "p_info_tools", "p_chunk_watch"]
tasks = [
	{ type = "checkmark" },
]
rewards = [
	{ type = "xp", xp = 40 },
	{ type = "toast" },
]
