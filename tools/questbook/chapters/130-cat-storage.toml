# 类目 · 仓储
#
# 本章的 mod 家族（逐个核对过：`python tools/item_index.py --ns <ns>`）：
#   · Storage Delight `storagedelight`（170 项：橱柜 / 抽屉 / 书橱 / 台面柜 / 食品柜）
#   · Travelers Backpack `travelersbackpack`（105 项：背包本身 + 内胆与升级件）
#   · Create 仓储段 `create`：item_vault · packager · repackager · stock_ticker · stock_link ·
#     redstone_requester · stockpile_switch · chute · smart_chute · depot · weighted_ejector ·
#     funnel（安山/黄铜）· mechanical_arm · factory_gauge · content_observer ·
#     package_filter · package_frogport ·
#   · Lootr `lootr`（10 项 + 16 条 advancement：战利品箱/桶/潜影盒/奖杯）
#   · FTB Filter System `ftbfiltersystem`（1 项：smart_filter）
#
# **覆盖不到的两种**（不是漏写，是这两个 mod 没有可持有的物品，逐条给证据）：
#   · Cupboard `cupboard`：它是个**库**（jar 30KB，只有 config / mixin / util 与一个空的
#     `assets/` 目录，`assets/*/models/item/` 条目数 = 0）；注册表里没有 `cupboard` 命名空间。
#     按说明书 §6，纯库 mod 不该有任务 → 本章不写它
#   · Shulker Box Tooltip `shulkerboxtooltip`：纯客户端预览界面（jar 里同样 0 个 item model，
#     注册表无该命名空间），"看过一眼预览"在游戏里没有任何信号 → 不硬凑
#
# 与其它章的分工：
#   · 机械动力章 (`60-create`)  = 物流**原理**（带、漏斗、机械臂、打包的机制）
#   · 机械动力·物流 (`62-logistics`) = 产线**吞吐**视角
#   · 基建章     = 公共仓库**规模**（保险库 16 个、单库 5000 单位）
#   · 本章       = **放东西**这一段：随身（背包内胆）· 就近（柜与抽屉）· 回仓（Create 仓储机构）
#                  · 遗迹里每人的那一份（Lootr）· 只收该收的（过滤器）

