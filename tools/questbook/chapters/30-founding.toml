icon = "minecraft:shield"
shape = "rsquare"
deps = ["f_roster"]
tasks = [
	{ type = "item", item = "minecraft:shield", count = 3 },
	{ type = "item", item = "minecraft:name_tag", count = 3 },
]

[[quest]]
name = "f_meeting_rule"
