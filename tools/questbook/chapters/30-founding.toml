# 立国（时代 1 · founding）
#
# 时代定义：`eras.json` → id=founding, name=立国, durationHours=40, coefficient=1.15
# 主菜：**领地与治理**（DESIGN.md §17.2）
#
# 判据来源与一条实测限制
# ----------------------
# ⚠️ **`openpartiesandclaims`（OPAC）与 `ftbteams` 不提供任何物品**：
#    它们的 lang 里 item/block 键数为 0，注册表里也没有它们的命名空间（实测）。
#    所以"圈地 / 组队"这类动作**没有物品判据**，只能自检。
#    （这跟邦交章遇到的是同一类问题：模组只提供命令/界面，不发信号。）
# 能自动判的：Create 的物品（仓库/物流）、原版物品、原版统计。
#
# 与其它章的分工（边界写清楚，免得写重）：
#   · 落地       (`20-landing`)  = 决定住下（选点、定水、分区、起名挂牌）
#   · 本章                       = **制度与骨架**：国号、四至、权限分层、编制、议事、
#                                  岗位、国徽国歌、五年计划、公示、继承 —— 全是"定规矩"
#   · 人口与民生 (`58-people`)   = **居民**（床位、职业、繁衍、治安、配给），本章不写村民
#   · 国库与营建 (`68-treasury`) = **税与预算**（账本、拨款、结算、审计），本章不写钱
#   · 领地与队伍 (`95-claims`)   = 权限的**技术细节**（档位怎么配、越界怎么测），
#                                  本章只写"要分几档、谁在哪一档"
#   · 立约       (`35-charter`)  = 约定与法典的**文本**；本章只立"规则怎么产生"
#
# checkmark 用量：7 条 —— 原有 3 条（圈地 / 组队 / 定下约定），新增 4 条
# （定国号 / 议事规则 / 给邻国定性 / 交接与继承规则）。
# 全部是「制度与共识」类判据，游戏里没有任何信号；理由逐条写在条目里。

key = "founding"
title = "立国"
subtitle = "把「我们」变成「我们的地、我们的规矩」"
group = "chronicle"
icon = "minecraft:white_banner"
order_index = 3
grid = { step = 1.5, row_h = 1.75 }

# ---------------- 国策主线 ----------------

[[quest]]
name = "claim_the_land"
title = "圈下国土"
desc = [
	"用认领工具把营地扩成国土——至少 9 个区块（3×3），别只圈一间房。",
	"OPAC 这类模组**没有物品接口**（实测：lang 里 item 键为 0），所以圈没圈成只能自己确认。",
	"验证方式：让一个不在队里的人试着挖一块——挖不动才算数。",
]
icon = "minecraft:white_banner"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "one_team"
title = "所有人进同一个队"
desc = [
	"两条路（FTB Teams 或 OPAC party），**只选一条**，别两套并行。",
	"同一类问题：队伍也没有物品判据。判据是你自己确认「所有人都能在领地里动东西」。",
]
icon = "minecraft:shield"
shape = "rsquare"
deps = ["claim_the_land"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "public_warehouse"
title = "公共仓库开张"
desc = [
	"不再靠背包搬运：把物资集中到一处，谁都能取。",
	"Create 的物品保险库是这一层的正解（一个保险库顶几十个箱子）。",
]
icon = "create:item_vault"
shape = "rsquare"
deps = ["one_team"]
tasks = [
	{ type = "item", item = "create:item_vault" },
]

[[quest]]
name = "warehouse_scale"
title = "仓库要装得下全队"
desc = [
	"一个保险库只是起步。攒到 16 个，才算「公共仓库」而不是「大一点的箱子」。",
]
icon = "create:item_vault"
shape = "circle"
size = 1.2
deps = ["public_warehouse"]
tasks = [
	{ type = "item", item = "create:item_vault", count = 16 },
]

[[quest]]
name = "pact_on_paper"
title = "定下约定"
desc = [
	"把规矩写下来放进议事厅（告示牌或成书）——至少一条要说清「违反了会怎样」。",
	"⚠️ 书的**内容**游戏判不了（放书架能检测，但「约定了」不能）。所以这一条自检。",
	"别写成墙上装饰：写一条真的会被执行的。",
]
icon = "minecraft:writable_book"
shape = "rsquare"
deps = ["one_team"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "meeting_hall"
title = "第一座地标：议事厅"
desc = [
	"由多人共同建成的一处公共建筑——它是这个国家第一个「不属于任何个人」的地方。",
]
icon = "minecraft:bell"
shape = "rsquare"
deps = ["pact_on_paper"]
tasks = [
	{ type = "item", item = "minecraft:bell" },
]

[[quest]]
name = "seats_for_all"
title = "议事厅坐得下所有人"
desc = [
	"摆够 8 个座位 —— 能坐下说话才算议事厅，站着开的会没人愿意来。",
]
icon = "minecraft:oak_stairs"
shape = "circle"
size = 1.2
deps = ["meeting_hall"]
tasks = [
	{ type = "item", item = "minecraft:oak_stairs", count = 8 },
]

# ---------------- 簇 1：国号与旗帜 ----------------

[[quest]]
name = "f_state_name"
title = "定国号"
desc = [
	"国号是一个要写在碑上、挂在旗上、刻在界碑上的东西 —— **定下来就别改**。",
	"规则很简单：两个字能念完、能缩写、不会和邻国重名。",
	"⚠️ 名字本身游戏判不了，自检；但下一段「立国公示」那条会把名字真的落到实物上。",
]
icon = "minecraft:oak_sign"
shape = "pentagon"
size = 2.0
deps = ["claim_the_land"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 2 },
	{ type = "checkmark" },
]

[[quest]]
name = "f_national_flag"
title = "国旗"
desc = [
	"旗的颜色是有含义的：三种色就够，多了从远处看不清。",
	"旗要先在议事厅挂一面，再复制到每个入口与界碑旁 —— **同一面旗出现三次，它才算国家的**。",
]
icon = "minecraft:white_banner"
shape = "rsquare"
deps = ["f_state_name"]
tasks = [
	{ type = "item", item = "minecraft:white_banner", count = 3 },
	{ type = "item", item = "minecraft:white_dye", count = 8 },
]

[[quest]]
name = "f_flag_pattern"
title = "给旗加图案"
desc = [
	"纯色旗和别人的分不开。一个图案纹样就够：它是这面旗的「签名」。",
]
icon = "minecraft:globe_banner_pattern"
shape = "circle"
size = 1.2
deps = ["f_national_flag"]
tasks = [
	{ type = "item", item = "minecraft:globe_banner_pattern" },
	{ type = "item", item = "minecraft:flower_banner_pattern" },
]

[[quest]]
name = "f_flag_hall"
title = "旗挂在议事厅正面"
desc = [
	"旗杆立在议事厅门口，**朝着国门的方向**。",
	"它同时兼一个功能：从外面回来的人，远远看见旗就知道到家了。",
]
icon = "minecraft:item_frame"
shape = "circle"
size = 1.2
deps = ["f_flag_pattern", "meeting_hall"]
tasks = [
	{ type = "item", item = "minecraft:white_banner", count = 2 },
	{ type = "item", item = "minecraft:lantern", count = 4 },
]

# ---------------- 簇 2：四至与界碑 ----------------

[[quest]]
name = "f_bounds_survey"
title = "量一遍四至"
desc = [
	"国土的四个方向各走到头，记下坐标：这就是「四至」，写进成书存进议事厅。",
	"四至不必是矩形 —— 但**必须能一句话说清边界在哪**，否则守不住也管不了。",
]
icon = "minecraft:cartography_table"
shape = "pentagon"
size = 2.0
deps = ["claim_the_land"]
tasks = [
	{ type = "item", item = "minecraft:cartography_table" },
	{ type = "item", item = "minecraft:written_book" },
]

[[quest]]
name = "f_boundary_stones"
title = "立界碑"
desc = [
	"四角各一块刻字石头：正面国号，背面坐标与朝向。",
	"界碑是**给外人看的**：不认字的人也知道这里有人管。",
]
icon = "minecraft:chiseled_stone_bricks"
shape = "rsquare"
deps = ["f_bounds_survey"]
tasks = [
	{ type = "item", item = "minecraft:chiseled_stone_bricks", count = 8 },
]

[[quest]]
name = "f_stone_numbering"
title = "界碑编号"
desc = [
	"界碑一多就会乱：用雕凿工具或木牌给每块编号，编号与四至那本书对得上。",
	"没有编号的界碑，几年后没人说得清哪块是哪块。",
]
icon = "chipped:chisel"
shape = "circle"
size = 1.2
deps = ["f_boundary_stones"]
tasks = [
	{ type = "item", item = "chipped:chisel" },
	{ type = "item", item = "minecraft:oak_sign", count = 8 },
]

[[quest]]
name = "f_border_markers"
title = "沿边界的路标"
desc = [
	"边界不只有四角：每隔一段插一根柱子或火把，走夜路时边界是看得见的。",
]
icon = "minecraft:torch"
shape = "square"
deps = ["f_boundary_stones"]
tasks = [
	{ type = "item", item = "minecraft:torch", count = 32 },
	{ type = "item", item = "minecraft:stripped_oak_log", count = 8 },
]

# ---------------- 簇 3：权限分层 ----------------

[[quest]]
name = "f_role_tiers"
title = "权限分三档"
desc = [
	"**全员同权限等于没有权限**。要分的档：能管（动边界与成员）、能建（动方块）、能住（只进出门与用设施）。",
	"这一条只定「分几档、每档能干什么」；具体怎么在 OPAC 里配置是另一章的事。",
]
icon = "minecraft:shield"
shape = "pentagon"
size = 2.0
deps = ["one_team"]
tasks = [
	{ type = "item", item = "minecraft:shield", count = 3 },
]

[[quest]]
name = "f_role_list"
title = "把每档的名单写出来"
desc = [
	"牌子上写清：谁在哪一档、为什么。名单要贴在议事厅，不能只存在队长的记忆里。",
]
icon = "minecraft:oak_sign"
shape = "rsquare"
deps = ["f_role_tiers"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 4 },
	{ type = "item", item = "minecraft:item_frame", count = 2 },
]

[[quest]]
