	"⚠️ 规则文本游戏判不了，自检。少的不是仪式，是**出事时知道找谁拍板**。",
]
icon = "minecraft:lectern"
shape = "rsquare"
deps = ["f_squads"]
tasks = [
	{ type = "item", item = "minecraft:lectern" },
	{ type = "checkmark" },
]

[[quest]]
name = "f_minutes"
title = "会议记录本"
desc = [
	"每次议完留一页：定了什么、谁反对、下次检查什么。",
