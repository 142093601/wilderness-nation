# ---------------- 簇 8：公示、节日、纳新、继承 ----------------

[[quest]]
name = "f_celebration_day"
title = "定国庆日"
desc = [
	"把「立国碑竖起来的那一天」定成国庆日，写进国册与公示牌。",
	"每年这一天做同一件事：读一遍国册、检查一遍四至、看一眼五年计划。",
]
icon = "minecraft:clock"
shape = "rsquare"
deps = ["f_first_vote"]
tasks = [
	{ type = "item", item = "minecraft:clock" },
	{ type = "item", item = "minecraft:written_book" },
]

[[quest]]
name = "f_public_notice"
title = "立国公示"
desc = [
	"在议事厅门口立一块公共告示：国号、成立日期、四至、当前成员数。",
	"这是**这个国家的门面**：新来的人、路过的人，先看它。",
]
icon = "minecraft:oak_sign"
shape = "rsquare"
deps = ["f_state_name", "f_celebration_day"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 6 },
	{ type = "item", item = "minecraft:lantern", count = 4 },
]

[[quest]]
name = "f_charter_book"
title = "国册成书"
desc = [
	"把四件事抄进同一本成书：国号与旗、四至与界碑编号、权限三档、议事规则。",
	"这本册子要**能被抄写** —— 副本存在议事厅，正本跟着当值的人。",
]
icon = "minecraft:writable_book"
shape = "rsquare"
deps = ["f_public_notice", "f_permission_done", "f_meeting_rule"]
tasks = [
	{ type = "item", item = "minecraft:writable_book" },
	{ type = "item", item = "minecraft:book", count = 8 },
]

[[quest]]
name = "f_join_process"
title = "新成员加入流程"
desc = [
	"四步写清：谁引荐、谁批准、给什么（住处与工具）、先干什么。",
	"没有流程，新人前几天就只能在城里乱转 —— 这是**最容易流失人的一段时间**。",
]
icon = "minecraft:name_tag"
shape = "rsquare"
deps = ["f_charter_book"]
tasks = [
	{ type = "item", item = "minecraft:name_tag", count = 2 },
	{ type = "item", item = "minecraft:bread", count = 8 },
	{ type = "item", item = "minecraft:stone_pickaxe" },
]

[[quest]]
name = "f_succession"
title = "交接与继承规则"
desc = [
	"写清两件事：当值的人长期不在时谁接手、国册与钥匙交给谁。",
	"⚠️ 判不了，自检。**这是全章最容易被跳过、也最容易出事的一条。**",
	"验收方式：假装当值的人明天不来了，念一遍规则 —— 念不下去就是没写清。",
]
icon = "minecraft:chest"
shape = "rsquare"
deps = ["f_join_process"]
tasks = [
	{ type = "item", item = "minecraft:chest" },
	{ type = "item", item = "minecraft:written_book" },
	{ type = "checkmark" },
]

