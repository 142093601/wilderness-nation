]
icon = "minecraft:oak_door"
shape = "rsquare"
deps = ["f_role_list"]
tasks = [
	{ type = "item", item = "minecraft:iron_door" },
	{ type = "item", item = "minecraft:lever" },
]

[[quest]]
name = "f_permission_done"
title = "权限这块闭环了"
desc = [
	"分档、名单、访客规则三样齐了，「我们的地」才算有一套能执行的说法。",
	"从这一条起，国土的边界不再靠人盯着。",
]
icon = "minecraft:iron_bars"
shape = "octagon"
size = 1.75
deps = ["f_guest_rule"]
tasks = [
	{ type = "item", item = "minecraft:iron_bars", count = 16 },
]

# ---------------- 簇 4：编制与议事 ----------------

[[quest]]
name = "f_roster"
