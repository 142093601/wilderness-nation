# 类目 · 结构与遗迹
#
# 本章的 mod 家族（每个都开过 jar：`data/<ns>/` 的命名空间不是猜的）：
#
#   YUNG's 全家 8 个（**命名空间与 jar 文件名不一样，逐个查过**）：
#     · yungs-better-caves            → `bettercaves`（只有 configured_carver + biome_modifier）
#     · yungs-better-dungeons         → `betterdungeons`（5 个结构 + 7 条进度）
#     · yungs-better-end-island       → `betterendisland`（只有主岛的 .nbt 构件）
#     · yungs-better-jungle-temples   → `betterjungletemples`（structure: jungle_temple）
#     · yungs-better-mineshafts       → `bettermineshafts`（13 个 structure）
#     · yungs-better-nether-fortresses→ `betterfortresses`（structure: fortress）
#     · yungs-better-ocean-monuments  → `betteroceanmonuments`（structure: ocean_monument）
#     · yungs-better-strongholds      → `betterstrongholds`（structure: stronghold）
#   · dungeons-and-taverns → 数据命名空间 `nova_structures`（96 个 structure + 34 条进度），
#     **物品却在 `dnt`**（`assets/dnt/lang/en_us.json` 里的 `item.dnt.*_key`）——两个命名空间都真
#   · when-dungeons-arise → `dungeons_arise`（40 个 structure + 39 条进度）
#   · towns-and-towers → `towns_and_towers`（60 个 structure）
#   · repurposed-structures → `repurposed_structures`（107 个 structure + 19 条进度）
#   · medieval-buildings → `medieval_buildings` / 下界版 `medieval_nether` / 末地版 `medievalend`
#   · grim-kingdoms → `grim_kingdoms`（65 个 structure）
#   · additional-structures → `additionalstructures`（198 个 structure）
#   · tidal-towns → `joshie`（**命名空间是作者名**，structure: village_ocean）
#   · choicetheorems-overhauled-village → `ctov`（78 个 structure）
#   · betterarcheology → `betterarcheology`（102 项 + 25 个 structure + 29 条进度）
#   · lootr → `lootr`（10 项 + 16 条进度）
#   · terralith → `terralith`（28 个 structure + 2112 项群系数据）
#
# 判据怎么来的（结构类 mod 大多没有物品，所以**逐条**说明用了哪一层）：
#   ① 实物：`betterarcheology` / `lootr` / `dnt` 三家的方块与物品 → 直接 `item`
#   ② 进度：`betterdungeons`(7) · `nova_structures`(34) · `dungeons_arise`(39) ·
#      `repurposed_structures`(19) · `betterarcheology`(29) · `lootr`(16) —— 全部对着
#      `tools/registry.json` 的 `advancements` 逐条核过，都是"找到某结构"类进度
#   ③ `structure`：id 一律来自 jar 里 `data/<ns>/worldgen/structure/<path>.json` 的**路径**。
#      带斜杠的也真的存在 —— `ctov:large/village_plains` 这个字符串能在
#      `data/ctov/structure_icons.json` 与 `data/ctov/tags/worldgen/structure/*.json` 里读到，
#      不是我按规则推的。
#   ④ `dimension`：只有 Better End Island 一条。它不发进度、不发物品、只有主岛的 .nbt 构件，
#      而它改的就是**末地主岛**本身 —— 踏上主岛即已被它影响，所以用「到过末地」判。
#   ⑤ **checkmark：本章 0 条**。上面 22 个家族每一个都有真实信号，不需要自检打勾。
#
# 与其它章的分工：
#   · 地图与导航 (`150-cat-explore`) = 怎么**找**到遗迹（罗盘、地图、传送网络）
#   · 出关 (`45-expedition`)         = 远征的**组织**（补给、前哨、带回什么）
#   · 仓储 (`130-cat-storage`)       = Lootr 的**仓储面**（遗迹箱子每人一份 → 卸货入库）
#   · 实用与奇物 (`144-cat-utility`) = Better Archeology 的**奇物面**（图腾、神器、相机旁的展示）
#   · 本章 = 遗迹**本身**：地下（簇 1）· 地表与村庄（簇 2）· 下界与末地（簇 3）·
#     海洋与远方（簇 4）· 考古与战利品（簇 5）
#   ⚠️ 已知重叠（写给汇总的人）：Better Archeology（`144-cat-utility`）与 Lootr
#     （`130-cat-storage`）都被 ROSTER 同时划给两章；本章按上面的分工只取
#     「遗迹里的考古现场」与「遗迹里的那一份战利品」，两章用的**条目没有重复**。
#
# 形状说明：本簇按**主题**分簇（不是按 mod 分簇），所以 `pentagon` 给的是
#   簇头与各家第一条主链，不是"每个 mod 一个"—— 22 个家族每个一条 pentagon 会占掉半章。

key = "cat_structures"
title = "结构与遗迹"
subtitle = "地下的、地上的、别的维度的：值得专程去一趟的地方"
group = "category"
icon = "minecraft:mossy_stone_bricks"
order_index = 61

grid = { step = 1.5, row_h = 1.75 }

