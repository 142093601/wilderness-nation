# 编年 · 生存第一课
#
# 这一章为什么在「序」和「落地」之间
# --------------------------------
# 序讲的是**这本书怎么用**，落地讲的是**国家怎么开始**。
# 中间缺了一课：**一个还没决定要建国的玩家，头两天要活下来**。
# 这段内容不属于任何 mod（全是原版），也没有任何"国家"色彩，
# 但它决定了后面所有章能不能开始 —— 饿死在第一天的人不会来翻任务书。
#
# 与其它章的分工：
#   · 本章   = 个人层面的"活到能动手"（木 → 石 → 铁 → 有一张床）
#   · 落地   = 集体层面的"把营地固定下来"（选址、水、圈地、领地）
#   · 生存线不重复讲 mod：木材/石头/铁怎么来，JEI 一查就有，这里只排顺序。
#
# 判据：**全是实物**（持有工具/食物/材料），没有一条 checkmark。

key = "survival"
title = "生存第一课"
subtitle = "先活到能动手，再谈立国"
group = "chronicle"
icon = "minecraft:wooden_pickaxe"
order_index = 1

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：木与石 ----------------

[[quest]]
name = "sv_wood"
title = "先砍树"
desc = [
	"任何路线的第一格都是原木。先攒够一组，别砍两棵就跑去挖矿。",
]
icon = "minecraft:oak_log"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "minecraft:oak_log", count = 16 },
]

[[quest]]
name = "sv_table"
title = "工作台"
desc = [
	"没有工作台，后面所有东西都做不出来。它也是你要记住「回家的那个方块」。",
]
icon = "minecraft:crafting_table"
shape = "rsquare"
deps = ["sv_wood"]
tasks = [
	{ type = "item", item = "minecraft:crafting_table" },
]

[[quest]]
name = "sv_wood_pick"
title = "木镐"
desc = [
	"第一把镐子只能挖石头。它的意义不是「好用」，是**把石头变成可获取资源**。",
]
icon = "minecraft:wooden_pickaxe"
shape = "rsquare"
deps = ["sv_table"]
tasks = [
	{ type = "item", item = "minecraft:wooden_pickaxe" },
]

[[quest]]
name = "sv_cobble"
title = "圆石"
desc = [
	"圆石是第一个「要多少有多少」的材料：工具、熔炉、墙，全从它开始。",
]
icon = "minecraft:cobblestone"
shape = "square"
deps = ["sv_wood_pick"]
tasks = [
	{ type = "item", item = "minecraft:cobblestone", count = 64 },
]

[[quest]]
name = "sv_stone_tools"
title = "石器一套"
desc = [
	"镐、斧、锹、剑换一遍。石制工具是这一章的「工作马」，别省。",
]
icon = "minecraft:stone_pickaxe"
shape = "rsquare"
deps = ["sv_cobble"]
tasks = [
	{ type = "item", item = "minecraft:stone_pickaxe" },
	{ type = "item", item = "minecraft:stone_axe" },
	{ type = "item", item = "minecraft:stone_shovel" },
	{ type = "item", item = "minecraft:stone_sword" },
]

[[quest]]
name = "sv_furnace"
title = "熔炉"
desc = [
	"熔炉是把「挖到的」变成「能用的」的唯一入口。第一个熔炉放在营地中心。",
]
icon = "minecraft:furnace"
shape = "rsquare"
deps = ["sv_cobble"]
tasks = [
	{ type = "item", item = "minecraft:furnace" },
]

[[quest]]
name = "sv_charcoal"
title = "先烧木炭"
desc = [
	"没找到煤之前，木炭就是煤。这一步让「照明」不必等运气。",
]
icon = "minecraft:charcoal"
shape = "circle"
size = 1.2
deps = ["sv_furnace"]
tasks = [
	{ type = "item", item = "minecraft:charcoal", count = 8 },
]

[[quest]]
name = "sv_torch"
title = "点亮营地"
desc = [
	"火把不是装饰，是**刷怪范围的开关**。营地范围内不留黑块，是硬纪律。",
]
icon = "minecraft:torch"
shape = "square"
deps = ["sv_charcoal"]
tasks = [
	{ type = "item", item = "minecraft:torch", count = 32 },
]

