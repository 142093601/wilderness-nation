# 类目 · 食物与烹饪
#
# 本章的 mod：Farmer's Delight（本体：刀 · 砧板 · 厨锅 · 煎锅 · 沃土 · 作物）·
#   Cooking for Blockheads（厨房多方块：烹饪桌 · 烤箱 · 冰箱 · 保鲜室）·
#   Farm & Charm（锅灶 · 烘焙机 · 绞肉机 · 肥沃泥土 · 洒水器）·
#   Brewin' And Chewin'（发酵桶 · 控温 · 奶酪）· Vinery（葡萄 · 压榨 · 陈酿 · 酒柜）·
#   Expanded Delight · Ender's Delight · Ocean's Delight · Nether's Delight ·
#   Miner's Delight（minersdelight 与 miners_delight 两个命名空间）·
#   Chef's Delight（厨师村民）
#
# 与其它章的分工：
#   · 农牧与种植章 = 从种子到食材（地、肥料、牲畜、村民、吃法）
#   · 本章         = 从食材到菜（厨具、菜谱、酒）——也就是「做出来的那一端」
#   · 仓储章       = 存放（Storage Delight 的橱柜与抽屉在那边）
#
# 两点说明：
#   1. 本章早先留下的两条（食物专用储藏 · 市场与种子）分属仓储章与农牧章的内容，
#      名字已定不可改，故原地保留；那两个 mod 的正文覆盖在 130 / 124 章里补足。
#   2. 奖励只给簇头与终局。簇 1 的头是既有的 food_knife，按「既有条目只追加、不修改」
#      的约定没有给它补奖励；簇 2 / 3 / 4 的头是本次新增，带奖励。

key = "cat_food"
title = "食物与烹饪"
subtitle = "从「够吃」到「好吃」：这一章是全队幸福感的来源"
group = "category"
icon = "farmersdelight:cooking_pot"
order_index = 54

grid = { step = 1.5, row_h = 1.75 }

