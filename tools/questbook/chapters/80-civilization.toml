# ================= 追加：文明的软性面（2026-09-22）=================
# 原章做的是**能留下来的东西**：大工程、国史、分区、图书馆、第二城、终局碑。
# 这一轮补的是「城市不只是建筑」的那一半：时间、度量、礼节、节日、教育、艺术、
# 分区规划、环境、公共安全、对外形象。
#
# 判据用到的 mod（逐个核过 id）：
#   · `create`：布谷鸟钟（全城计时）、遥控器讲台（公开讲学）、桌上铃（接待）。
#   · `createrailwaysnavigator`：车站时钟（公共报时）。
#   · `supplementaries`：时钟方块、黑板、书堆、地球仪、公告板、基座。
#   · `handcrafted`：长椅与椅子（宴席、接待）。
#   · `amendments`：双层蛋糕、吊顶旗帜（节庆）。
#   · `immersive_paintings`：自制画与涂鸦（壁画）。
#   · `letsparkour`：九种跑酷台阶（体育场与赛道）。
#   · `tfmg`：万用表（度量衡的实物）。
#   · 原版：烟花、唱片、烟花之星、皮革衣装、锻纹模板。
#
# **覆盖不到的两个（不是漏写，是还没进包）**：`macaws-paintings` 与 `medieval-paintings`
# 在 `modlist.tsv` 里的状态还是 `plan`，`tools/registry.json` 里没有 `macawspaintings`
# 与 `medieval_paintings` 命名空间 —— 写它们只会得到永远做不完的任务，所以不写。
#
# 与 `40-infra` 的分工：那一章是时代 2 的**工程目标**（水电路桥）；本章是文明时代的
# **城市形态与社会性内容**（时间、礼节、教育、艺术、规划、卫生、治安、对外）。
# 与 `88-legacy` 的分工：那一章管「记住与交接」，本章只管「活着的时候像个城」。

