[[quest]]
name = "l_feed_reserve"
title = "饲料与口粮分开"
desc = [
	"喂牲口的麦子与给人吃的口粮必须是两笔账 —— 混着放，灾年就得杀牲口。",
	"干草块是最省地方的饲料形态。",
]
icon = "minecraft:hay_block"
shape = "circle"
size = 1.2
deps = ["l_livestock_pen"]
tasks = [
	{ type = "item", item = "minecraft:hay_block", count = 8 },
]

# ---------------- 簇 7：床与重生点 ----------------

[[quest]]
name = "l_bed_for_all"
title = "每人一张床"
desc = [
	"床把重生点固定在营地里 —— 这是「落地」两个字最实际的含义。",
	"床位不够时先把床补齐，再谈盖房：先能活，再住得好。",
]
icon = "minecraft:white_bed"
shape = "pentagon"
size = 2.0
deps = ["first_roof"]
tasks = [
	{ type = "item", item = "minecraft:white_bed", count = 4 },
]

[[quest]]
name = "l_rest_zone"
title = "生活区圈出来"
desc = [
	"卧室集中在一处，离工作棚远一点：夜里熔炉还在响，睡不踏实。",
	"生活区与作业区分开之后，营地第一次有了「街」的概念。",
]
icon = "minecraft:oak_door"
shape = "rsquare"
deps = ["l_bed_for_all"]
tasks = [
	{ type = "item", item = "minecraft:oak_door", count = 6 },
]

[[quest]]
name = "l_travel_bed"
title = "出工也带睡袋"
desc = [
	"外出砍柴、探路、跑远活时带一张睡袋：就地睡一觉，不必赶回营地。",
	"它不替换营地的床，只是把「回不回得去」这件事的压力降下来。",
]
icon = "comforts:sleeping_bag_white"
shape = "circle"
size = 1.2
deps = ["l_bed_for_all"]
tasks = [
	{ type = "item", item = "comforts:sleeping_bag_white", count = 2 },
]

[[quest]]
name = "l_anchor_point"
title = "营地锚点"
desc = [
	"一块磁石加一个重生点标记：从外面回来时，不必先找地图就知道家在哪个方向。",
	"落地期的「回家」还只是方向问题；到出关章，它会变成补给与通讯问题。",
]
icon = "minecraft:recovery_compass"
shape = "circle"
size = 1.2
deps = ["l_rest_zone"]
tasks = [
	{ type = "item", item = "minecraft:recovery_compass" },
]

# ---------------- 簇 8：给营地起名挂牌 ----------------

[[quest]]
name = "l_camp_name"
title = "给营地起个名"
desc = [
	"没名字的地方不能叫「家」，只能叫「附近」。",
	"名字要能刻在牌上、写进书里、挂在旗上 —— 取之前先想清楚它好不好念。",
	"⚠️ 名字本身游戏判不了，但牌子与旗是实物判据。",
]
icon = "minecraft:oak_sign"
shape = "pentagon"
size = 2.0
deps = ["l_zone_signs"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 2 },
	{ type = "item", item = "minecraft:white_banner" },
	{ type = "item", item = "minecraft:item_frame", count = 2 },
]

[[quest]]
name = "l_welcome_board"
title = "入口挂牌"
desc = [
	"在营地入口挂一块牌：写名字、写落成年月、写谁立的。",
	"这是全包第一块「公共文字」—— 立国章那块公示牌是它的正式版。",
]
icon = "minecraft:oak_hanging_sign"
shape = "rsquare"
deps = ["l_camp_name"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 4 },
	{ type = "item", item = "minecraft:lantern", count = 4 },
]

[[quest]]
name = "l_camp_bell"
title = "营地的钟"
desc = [
	"在广场上放一口钟：站在这块地上敲一下，所有人知道该回哪儿。",
	"它同时是「这块地已经有人管」最省事的信号 —— 不必等旗杆立起来。",
]
icon = "minecraft:bell"
shape = "rsquare"
deps = ["l_welcome_board"]
tasks = [
	{ type = "item", item = "minecraft:bell" },
]

# ---------------- 簇 9：通往水与林的两条路 ----------------

[[quest]]
name = "l_road_water"
title = "去水源的路"
desc = [
	"营地到井/河之间铺一条**能推车**的路：碎石或木板均可，关键是宽度一致、不绕路。",
	"这条路以后会被当作全城路网的基线，别随手铺。",
]
icon = "minecraft:gravel"
shape = "pentagon"
size = 2.0
deps = ["l_well"]
tasks = [
	{ type = "item", item = "minecraft:gravel", count = 64 },
]

[[quest]]
name = "l_road_forest"
title = "去林场的路"
desc = [
	"第二条路通往木料来源。两条路不要在营地正中交叉 —— 交汇点会变成事实上的广场。",
	"路上每隔一段放一盏灯，天黑也能走。",
]
icon = "minecraft:dirt_path"
shape = "rsquare"
deps = ["l_road_water"]
tasks = [
	{ type = "item", item = "minecraft:dirt_path", count = 32 },
	{ type = "item", item = "minecraft:torch", count = 16 },
]

# ---------------- 簇 10：留白与扩建 ----------------

[[quest]]
name = "l_reserve_zone"
title = "预留扩建区"
desc = [
	"**故意空出一块地**不盖东西：以后的仓库、议事厅、纪念碑都要地方。",
	"落地期最贵的错误是把好地皮用棚子填满 —— 后面每一间房都得拆。",
]
icon = "minecraft:stone_bricks"
shape = "pentagon"
size = 2.0
deps = ["l_zone_signs"]
tasks = [
	{ type = "item", item = "minecraft:stone_bricks", count = 16 },
	{ type = "item", item = "minecraft:oak_sign", count = 4 },
]

[[quest]]
name = "l_mark_boundary"
title = "先把四角标出来"
desc = [
	"在预留区的四个角各放一根柱子或一块石砖，标出这块地**已经有人认领**。",
	"这是立国章「四至与界碑」的草稿：正式界碑要有编号，这里只要一根柱子。",
]
icon = "minecraft:stripped_oak_log"
shape = "circle"
size = 1.2
deps = ["l_reserve_zone"]
tasks = [
	{ type = "item", item = "minecraft:stripped_oak_log", count = 4 },
]

# ---------------- 簇 11：落成 ----------------

[[quest]]
name = "l_founding_kit"
title = "落成仪式的料"
desc = [
	"碑、旗、灯三样先备齐：石碑刻字、旗帜挂名、灯笼通宵点着。",
	"这些东西本身不难做，难的是**在搬进去之前就把它们准备好**。",
]
icon = "minecraft:chiseled_stone_bricks"
shape = "rsquare"
deps = ["l_camp_bell", "l_road_forest"]
tasks = [
	{ type = "item", item = "minecraft:chiseled_stone_bricks", count = 8 },
	{ type = "item", item = "minecraft:white_banner", count = 2 },
	{ type = "item", item = "minecraft:lantern", count = 8 },
]

