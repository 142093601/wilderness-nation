	"井不只是取水点，它是**营地的中心**：所有分区从此按「离井多远」来摆。",
	"石砖围一圈，加炼药锅与栅栏盖，免得有人掉进去。",
]
icon = "minecraft:stone_bricks"
shape = "pentagon"
size = 2.0
deps = ["l_water_check"]
tasks = [
	{ type = "item", item = "minecraft:stone_bricks", count = 24 },
	{ type = "item", item = "minecraft:cauldron" },
	{ type = "item", item = "minecraft:water_bucket", count = 2 },
]

[[quest]]
name = "l_cistern"
title = "蓄水缸"
desc = [
	"井会被占、河会走远：一排炼药锅就是营地的短期储备。",
	"灭火、洗涤、配药都从这里取，不必每次跑井边。",
]
icon = "minecraft:cauldron"
shape = "square"
deps = ["l_well"]
tasks = [
	{ type = "item", item = "minecraft:cauldron", count = 4 },
]

[[quest]]
name = "l_waste_pit"
title = "垃圾与排污点"
desc = [
	"落地阶段第一个真正的「公共问题」不是粮食，是**往哪儿扔东西**。",
	"定一个固定的坑：岩浆处理可燃与腐坏物，远处一格专门堆建材废料。",
	"有了这个点，「营地里到处是随手丢的箱子」这件事才会停。",
]
icon = "minecraft:lava_bucket"
shape = "rsquare"
deps = ["l_well"]
