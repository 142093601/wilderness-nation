# 落地（时代 0 · landing）
#
# 判据来源与设计意图
# ------------------
# DESIGN.md §17.1 给了五条「深度验收标准」；这里把它们落成**可判定的判据**。
#
# ⚠️ 一条关键约束（写这一章时踩出来的）：
#    **`item` 判据检测的是「持有/消耗」，不是「放置」** —— 所以"放下营火""围起栅栏"
#    这类**行为**用 item 判据表达不了，硬套会让任务退化成"物品清单"。
#    能用行为判据的优先用：`stat`（原版统计）与 `advancement`（原版/模组进度）。
#    明细见 QUESTBOOK-CRITERIA.md。
#
# 主线：选址 → 住处 → 火与食 → 第一夜 → 落成碑
# 支线：水源 / 圈地 / 领地 / 探路 / 武器
#
# 配额已废：这一章不是 24h÷1.5h 摊出来的，是「引导需要」的结果。
#
# 与其它章的分工（边界写清楚，免得写重）：
#   · 生存第一课 (`15-survival`) = **个人**活到能动手（木→石→铁→一张床）
#   · 本章                      = **集体决定在这块地上住下**：选点、定水、分区、围栏、
#                                 攒料、起名、留扩建区、立碑 —— 全是"决定"，不是"操作"
#   · 立国       (`30-founding`) = **正式立国**：国号、四至、权限、议事、公示
#   · 基建       (`40-infra`)    = 路网、桥、照明、供水、能源的**规模**
#   · 领地与队伍 (`95-claims`)   = 圈地系统的**技术细节**（权限档、越界测试）
#
# checkmark 用量：5 条（设立营地 / 过第一晚 / 围栏 / 圈地，以及「选址理由写下来了」）。
# 这几件事游戏里都没有信号；新增的 39 条里只有最后那一条用到 checkmark，
# 且它同时带一个实物判据（written_book）兜底 —— 其余全部是实物、统计或原版进度判据。

key = "landing"
title = "落地"
subtitle = "第一夜之前，先弄明白「我们为什么会在这里」"
group = "chronicle"
icon = "minecraft:campfire"
order_index = 2
grid = { step = 1.5, row_h = 1.75 }

# ---------------- 主线 ----------------

[[quest]]
name = "pick_ground"
title = "设立营地"
desc = [
	"找一块同时满足四件事的地方：水源、可耕地、能防守、附近有旧世痕迹。",
	"选址是集体决定，游戏里没有「大家同意了」这个信号，所以这一条自己打勾。",
	"别跳过它——后面每个时代的碑都立在这块地上。",
]
icon = "minecraft:campfire"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "first_roof"
title = "第一间避难所"
desc = [
	"有床、有门、有屋顶。躺下睡一觉——游戏会记下「你在这里过夜了」。",
]
icon = "minecraft:white_bed"
shape = "rsquare"
deps = ["pick_ground"]
tasks = [
	{ type = "stat", stat = "minecraft:sleep_in_bed", value = 1 },
]

[[quest]]
name = "fire_and_food"
title = "火与食"
desc = [
	"把熔炉点起来，炼出第一块铁。这一条游戏会自己确认。",
]
icon = "minecraft:furnace"
shape = "rsquare"
deps = ["first_roof"]
tasks = [
	{ type = "advancement", advancement = "minecraft:story/smelt_iron" },
]

[[quest]]
name = "survive_first_night"
title = "活着过第一晚"
desc = [
	"游戏不记录「天亮时你到底在不在附近」，所以这一条没有可靠判据。",
	"天亮了、人还在、东西没丢，就自己打个勾。过不去，说明上面哪一条偷工减料了。",
]
icon = "minecraft:shield"
shape = "rsquare"
deps = ["fire_and_food"]
tasks = [
	{ type = "checkmark" },
]

# ---------------- 支线 ----------------

[[quest]]
name = "water_source"
title = "把水固定下来"
desc = [
	"别每次跑半张地图打水。用水桶把炼药锅灌满，就算是有了自己的水源。",
]
icon = "minecraft:water_bucket"
shape = "circle"
size = 1.2
deps = ["first_roof"]
tasks = [
	{ type = "stat", stat = "minecraft:fill_cauldron", value = 1 },
]

[[quest]]
name = "fence_the_camp"
title = "把营地围起来"
desc = [
	"栅栏围一圈，至少要有个能关上的入口。",
	"「围起来了」这件事游戏里判不了（原版没有「放置方块」统计）。",
]
icon = "minecraft:oak_fence"
shape = "circle"
size = 1.2
deps = ["first_roof"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "claim_the_land"
title = "把家圈成领地"
desc = [
	"用认领工具把营地圈下来——这是「我们的地」第一次在游戏里成立。",
	"之后别人的破坏、放置、开箱都会被拦。",
	"⚠️ 圈地的判据要等 mod 侧提供可检测信号（见 NEEDS-YOU / 交接说明），现在自检。",
]
icon = "minecraft:white_banner"
shape = "circle"
size = 1.2
deps = ["fence_the_camp"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "scout_500"
title = "走出生点 500 格"
desc = [
	"带上食物和水，往任意方向走满 500 格再回来。游戏会按步数自己算。",
	"重点不是走多远，是沿路记住：水在哪、地形怎么走、有没有旧世的痕迹。",
]
icon = "minecraft:map"
shape = "circle"
size = 1.2
deps = ["first_roof"]
tasks = [
	{ type = "stat", stat = "minecraft:walk_one_cm", value = 50000 },
]

[[quest]]
name = "a_real_sword"
title = "一把说得过去的剑"
desc = [
	"石器只能应急。铁制工具做出来，采集与战斗才算真正开始。",
	"从这一步起，你们才有余力想「留下点什么」——落成碑要等到它能立得稳。",
]
icon = "minecraft:iron_sword"
shape = "circle"
size = 1.2
deps = ["fire_and_food"]
tasks = [
	{ type = "advancement", advancement = "minecraft:story/iron_tools" },
]

# ---------------- 簇 1：选址评估（决定「住不住这儿」） ----------------

[[quest]]
name = "l_site_survey"
title = "画一张营地草图"
desc = [
	"落地第一步不是盖房子，是**把这块地看清楚**。",
	"一张地图加一路标记：哪边是水、哪边是林子、哪边会淹、哪边能通行。",
	"这张草图决定后面所有分区怎么摆 —— 摆错了，改起来的代价是拆房。",
]
icon = "minecraft:map"
shape = "pentagon"
size = 2.0
deps = ["pick_ground"]
tasks = [
	{ type = "item", item = "minecraft:map", count = 2 },
	{ type = "item", item = "minecraft:item_frame", count = 4 },
]

[[quest]]
name = "l_terrain"
title = "地势要看清"
desc = [
	"营地要同时有平地与坡地：平地盖房种田，坡地排水、防守、瞭望。",
	"记下最低点在哪 —— 下雨和灌溉都要靠这个判断。",
]
icon = "minecraft:spyglass"
shape = "rsquare"
deps = ["l_site_survey"]
tasks = [
	{ type = "item", item = "minecraft:spyglass" },
]

[[quest]]
name = "l_water_check"
title = "先确认水够不够"
desc = [
	"一处不够：至少两处独立水源（河、湖、泉各算一处），旱季与堵塞都不至于断水。",
	"水源离营地超过两百格，选址就该重新考虑。",
]
icon = "minecraft:water_bucket"
shape = "rsquare"
deps = ["l_site_survey"]
tasks = [
	{ type = "item", item = "minecraft:water_bucket", count = 2 },
]

[[quest]]
name = "l_forest_check"
title = "近处要有林子"
desc = [
	"木料是最先耗尽的东西：盖房、烧炭、做工具全要它。",
	"把最近的一片林子标下来，并且**只从这里取木**，别四面乱砍。",
]
icon = "minecraft:oak_log"
shape = "rsquare"
deps = ["l_site_survey"]
tasks = [
	{ type = "item", item = "minecraft:oak_log", count = 64 },
]

[[quest]]
name = "l_ore_check"
title = "浅层矿口"
desc = [
	"落地阶段只要两种矿：煤与铁。它们在浅层就够了，不必往下深挖。",
	"找到就记坐标 —— 第一个矿井的位置由它决定。",
]
icon = "minecraft:raw_iron"
shape = "rsquare"
deps = ["l_site_survey"]
tasks = [
	{ type = "item", item = "minecraft:raw_iron", count = 8 },
	{ type = "item", item = "minecraft:coal", count = 16 },
]

[[quest]]
name = "l_neighbor_scout"
title = "邻国有多远"
desc = [
	"这块地上不只你们：最近的村庄、据点、甚至别人的营地都在算距离之内。",
	"记下方位与距离，落地决议里要写清「和他们是什么关系」。",
]
icon = "minecraft:spyglass"
shape = "circle"
size = 1.2
deps = ["l_terrain"]
tasks = [
	{ type = "item", item = "minecraft:spyglass" },
	{ type = "item", item = "minecraft:map", count = 2 },
]

[[quest]]
name = "l_site_decision"
title = "把选址理由记下来"
desc = [
	"写成一页成书，至少三行：为什么是这里、放弃过哪里、这块地缺什么。",
	"⚠️ 书里**写了什么**游戏判不了（written_book 只证明「有一本成书」），",
	"所以这一条在实物判据之外补一个 checkmark：确认理由是**真的写下来**的。",
	"这一页后面会在落成碑上重写一遍 —— 现在写的是草稿，也是唯一的证据。",
]
icon = "minecraft:written_book"
shape = "rsquare"
deps = ["l_neighbor_scout", "l_ore_check", "l_forest_check", "l_water_check"]
tasks = [
	{ type = "item", item = "minecraft:written_book" },
	{ type = "checkmark" },
]

# ---------------- 簇 2：第一口井与排污 ----------------

[[quest]]
name = "l_well"
title = "第一口井"
