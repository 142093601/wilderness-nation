	"落地期的秩序全靠牌子：哪间放什么、哪格归谁，写在门口。",
	"牌子不解决管理问题，但它让**新来的人不必问人**。",
]
icon = "minecraft:oak_sign"
shape = "square"
deps = ["l_work_shed"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 12 },
]

# ---------------- 簇 4：围栏、门与照明 ----------------

