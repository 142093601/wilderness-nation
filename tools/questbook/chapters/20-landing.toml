[[quest]]
name = "l_compost"
title = "沤肥坑"
desc = [
	"厨余、落叶、烂作物都有去处：堆肥桶产骨粉，骨粉催苗。",
	"排污点不必只是「扔掉」，它可以是第一块田的肥料来源。",
]
icon = "minecraft:composter"
shape = "circle"
size = 1.2
deps = ["l_waste_pit"]
tasks = [
	{ type = "item", item = "minecraft:composter", count = 4 },
]

# ---------------- 簇 3：储物棚与工作棚 ----------------

[[quest]]
name = "l_store_shed"
title = "储物棚"
desc = [
	"把散落各人背包里的东西集中到一间棚：箱子排开，通道留够，能走进去找。",
	"这一间棚是后面「公共仓库」的雏形 —— 先有地方，再谈规矩。",
]
icon = "minecraft:chest"
shape = "pentagon"
size = 2.0
deps = ["l_well"]
tasks = [
	{ type = "item", item = "minecraft:chest", count = 12 },
	{ type = "item", item = "minecraft:barrel", count = 8 },
]

[[quest]]
name = "l_work_shed"
title = "工作棚"
desc = [
	"工作台、熔炉、箱子分开放：合成、烧炼、存货三条动线互不挡路。",
	"合成区要留出**站着不打架**的宽度 —— 多人同时用工作台是常态。",
]
icon = "minecraft:crafting_table"
shape = "rsquare"
deps = ["l_store_shed"]
tasks = [
	{ type = "item", item = "minecraft:crafting_table", count = 4 },
