shape = "circle"
size = 1.2
deps = ["l_fence_line"]
tasks = [
	{ type = "item", item = "minecraft:oak_trapdoor", count = 8 },
]

[[quest]]
name = "l_camp_light"
title = "夜里看得见路"
desc = [
	"灯不是装饰：围栏内侧走一圈全点亮，巡逻的人才知道自己走到哪一格。",
