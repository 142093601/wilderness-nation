# 类目 · 生活与出行
#
# 本章的 mod：Comforts(睡袋/吊床/绳梯) · Travelers Backpack(背包体系：内胆/升级/睡袋) ·
#             Small Ships(小船与帆船) · OpenBlocks Elevator(电梯) ·
#             Corail Tombstone + GraveStone Mod(死后物品与墓碑) ·
#             Seaworthy Boats(造船台) · Let's Parkour(跑酷板)
#
# 与其它章的分工：
#   · 仓储章 = 背包**内胆与分类**（storage 视角）；本章只讲「背着走」这一层
#   · 出关章 = 远行的**准备与补给点**；本章讲随身装备本身
#   · 防御章 = 尸潮与夜袭；本章讲「死了以后东西还在不在」
#   · 音画章 = Corail Tombstone 的**氛围**表现；本章只用它的墓碑与找回机制

key = "cat_comfort"
title = "生活与出行"
subtitle = "睡得下、带得走、过得了河、丢不了东西"
group = "category"
icon = "comforts:sleeping_bag_white"
order_index = 53

grid = { step = 1.5, row_h = 1.75 }

