# 出关（时代 3 · expedition）
#
# 时代定义：`eras.json` → id=expedition, name=远征, durationHours=50, coefficient=1.45
# unlocks: intel_station_2（情报站第三档的升级件在这个时代出现——与邦交章对应）
# 主菜：**远征**（DESIGN.md §17.4）
#
# 判据来源：原版结构/维度/生物群系进度 + 物品 + 统计。
# 结构 mod 大多不发进度（YUNG's / repurposed_structures 有少量），所以这一章主要靠
# 原版进度（到过某维度/某结构）与"带回什么"这两类判据 —— 都指向真实游戏事实。
#
# 本章的 mod（逐个核对过 `python tools/item_index.py --ns <ns>`）：
#   · Small Ships `smallships`（66 项：7 种船 × 9 种木 + sail + cannon + cannon_ball）
#   · Waystones `waystones`（63 项：waystone / sharestone / portstone / warp_* / *_scroll）
#   · Create 铁路段 `create`：track · track_station · track_signal · schedule · railway_casing
#   · Create Train Parts `create_train_parts`（16 项：道口闸门 / 台阶 / 伸缩踏板 / 滑动窗）
#   · Railways Navigator `createrailwaysnavigator`（10 项：导航仪 + 车站时钟 + 显示器）
#   · Steam 'n' Rails `railways`（列车长帽、指挥哨）
#   · Elevator `elevatorid`（16 项：16 色电梯）
#   · Explorer's Compass `explorerscompass` / Nature's Compass `naturescompass`（结构/群系定位）
#   · Player Tracking Compass `playertrackingcompass`（1 项：tracking_compass）
#   · Better Archeology `betterarcheology`（102 项：刷子 / 化石 / 图腾 / 神器 / 考古学桌）
#   · Portable Blueprints `portable_blueprints`（6 项：扫描仪 / 图纸 / 平板）
#   · TorchMaster `torchmaster`（4 项：巨型火把 / 野火灯笼 / 恐惧之灯 / 冰冻珍珠）
#   · Lootr `lootr`（遗迹每人一份的战利品容器）
#
# **覆盖不到的两种（不是漏写，逐条给证据）**：
#   · Xaero's Minimap / World Map `xaeros_*`：**纯客户端 mod，注册表里没有 `xaero*`
#     命名空间，也没有任何 item**（实测：`--stats` 的 100 个命名空间里没有它）。
#     它的产出是世界地图与路径点，都不是可持有物；"看过一眼地图"没有游戏信号。
#   · `dungeons_arise` / `nova_structures` / `repurposed_structures` / `betterdungeons`
#     等结构 mod：**未安装在 mods/ 里**（`registry.json` 的 advancements 表里有残留记录，
#     但 items 命名空间为 0）。本章的遗迹考察一律落到 `betterarcheology` 与 Lootr 上。
#
# 与其它章的分工：
#   · 类目·结构与遗迹 (`154-cat-structures`) = **结构 mod 家族**本身（有哪些、长什么样）
#   · 类目·地图与导航 (`150-cat-explore`)    = 导航 mod 家族的功能
#   · 蒸汽与铁路   (`75-steam`)              = 铁路的**建造与技术**
#   · 领地与队伍   (`95-claims`)             = 传送石的**权限与共享**
#   · 本章                                   = **「出远门」这件事怎么组织**：编制、联络、
#                                              补给点、导航纪律、交通、地形专项、报告、
#                                              搜救、前哨升级、边界外的标记
#
# checkmark 用量：3 条 —— 全部是**原有**条目（情报墙的覆盖率、出发名册的内容、
# 情报站升级动作），都是主观完成度或模组不发信号的界面动作，游戏里判不了；
# 本轮新增的 59 条**一条 checkmark 都没有**，全部落在实物 / 原版进度 / 统计上。

key = "expedition"
title = "出关"
subtitle = "要建 X，就必须去 Y——远征得先有理由"
group = "chronicle"
icon = "minecraft:compass"
order_index = 5
grid = { step = 1.5, row_h = 1.75 }

