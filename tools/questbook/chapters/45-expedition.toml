[[quest]]
name = "e_blueprint_scan"
title = "把建筑扫成图纸"
desc = [
	"Portable Blueprints：扫描仪把见到的建筑存成图纸，**带回来就能复建**。",
	"这是远征产出里唯一能直接变成「城里的东西」的一类。",
]
icon = "portable_blueprints:scanner"
shape = "rsquare"
deps = ["e_unexplored_mark"]
tasks = [
	{ type = "item", item = "portable_blueprints:scanner" },
	{ type = "item", item = "portable_blueprints:blueprint" },
]

[[quest]]
name = "e_frontier_done"
title = "边界推到哪，国就到哪"
desc = [
	"旗、锚点、据点、图纸四样齐了：边界以外第一次有了**可复现的东西**。",
	"下一时代是压力时代：把远征带回来的东西变成工事。",
]
icon = "minecraft:lodestone"
shape = "octagon"
size = 1.75
deps = ["e_post_garrison", "e_blueprint_scan"]
tasks = [
	{ type = "item", item = "minecraft:lodestone", count = 2 },
	{ type = "item", item = "portable_blueprints:blueprint", count = 2 },
]

# ---------------- 终局 ----------------

[[quest]]
name = "expedition_monument"
title = "远征碑"
desc = [
	"刻上走过多远、去过哪些地方。",
	"下一时代是压力时代：把远征带回来的东西变成工事。",
]
icon = "minecraft:stone_bricks"
shape = "hexagon"
size = 2.5
deps = ["nether_trip", "long_haul", "three_structures", "ocean_trip", "high_peak",
        "desert_run", "beacon_point", "forward_post", "gear_room", "archive", "tracking",
        "e_roll_call", "e_relay_net", "e_nav_done", "e_vehicle_net", "e_cave_haul",
        "e_swamp_run", "e_jungle_run", "e_snow_run", "e_ocean_deep", "e_end_run",
        "e_arch_done", "e_casualty_record", "e_frontier_done"]
tasks = [
	{ type = "item", item = "minecraft:stone_bricks", count = 32 },
]
rewards = [
	{ type = "command", command = "/statecraft accelerate" },
	{ type = "xp", xp = 120 },
	{ type = "toast" },
]
