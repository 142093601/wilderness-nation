# 类目 · 实用与奇物
#
# 本章的 mod：Waystones（只取**高级与奇物**那一层）· Better Archeology（考古、化石、图腾）·
#   Exposure（相机、胶卷、暗房、相框、投影）· Exposure: Polaroid（拍立得）·
#   Friends & Foes（新怪物带来的奇物：蟹钳、图腾、王冠、唱片）
#
# 与其它章的分工（这一章的定义）：
#   · 本章 = **不是装备、也不是家具，但「没有它很难受」的那些东西**
#   · 领地与队伍（95-claims）= Waystones 的**基础网络**（石碑、卷轴、分享石、绑定卷轴）——
#     所以本章只写它没用过的那一层：石盘、共鸣碎片、传送门卷轴、双生羽毛、墓志铭、传送石座
#   · 地图与探索（150-cat-explore）= Explorer's Compass 与 Nature's Compass，
#     那两个罗盘在那一章已经各有专条，本章**不再重复**
#   · 装饰 / 农牧 / 建筑各章 = 蜂箱与铜件的外观用途；本章只写「多一个养蜂人岗位」这种实用面
#
# 判据来源：全是实物（这一章的 mod 都注册了真实物品）。

key = "cat_utility"
title = "实用与奇物"
subtitle = "不推主线，但缺了天天别扭"
group = "category"
icon = "waystones:warp_plate"
order_index = 59

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：出行与落脚（Waystones 的高级层） ----------------

[[quest]]
name = "u_warp_plate"
title = "传送石盘"
desc = [
	"传送石碑解决「目的地在哪」，石盘解决「这两处之间怎么来回」。",
	"据点一多，固定两点之间的往返就是最先该省掉的那件事。",
]
icon = "waystones:warp_plate"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "waystones:warp_plate" },
]

