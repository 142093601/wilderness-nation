# 类目 · 尸潮与夜袭
#
# 本章的 mod（逐个核对过：`python tools/item_index.py --ns <ns>` → tools/out/P-*.txt）：
#   · The Hordes `hordes`：**0 物品 / 0 方块 / 0 进度**（实测；jar 里只有 assets 与 config_defaults）。
#     它加的是感染机制与尸潮事件本身 —— 所以本章用**它自己的尸潮表**当日程判据。
#   · Undead Nights `undeadnights`（4 项：三个刷怪蛋 + 黏腐肉；实体 `undeadnights:horde_zombie`
#     / `elite_zombie` / `demolition_zombie`）
#   · Enhanced Celestials `enhancedcelestials`（5 项：陨石 / 星苔方块·草·毯 / 星苔虫刷怪蛋；
#     0 进度、0 统计 —— 月相事件是纯事件，没有信号源）
#   · Easy Mob Spawn Control `easy_mob_spawn_control`：**纯配置 mod，0 物品**（只有 config/ 与 GUI）
#   · It Takes a Pillage `takesapillage`（7 项 + 5 条进度）
#
# 与相邻章的分工（**2026-09-22 与汇总人确认过的裁决，写在这里免得下一个人再撞**）：
#   · `70-defense`（技艺·防御与尸潮）= **工事 · 自动化防御 · 照明与预警**。
#     TorchMaster 四件（megatorch / dreadlamp / feral_flare_lantern / frozen_pearl）
#     与 `undeadnights` 三个实体的击杀判据（30 / 10 / 5）**都归它**，本章**不重复**。
#     它同时也占了 `hordes:zombie_player` 的镇杀与波次统计。
#   · `55-defense-era`（编年·御敌）= 国策与达标线：民兵编制、储备规格、感染护甲表、
#     免疫清单（附魔金苹果）、伤亡名册、遗物收殓、复盘。本章不写这些。
#   · `114-cat-comfort` = 死后与失物（Corail Tombstone 等），本章不碰。
#   · **本章** = 这套"夜里的东西"各自是什么、由谁发起、留下什么实物：
#     尸潮按天升档 · 天象（EC）· 地表成波 · 掠夺者阵营的四种兵 · 天亮之后的善后
#
# 判据来源（逐条查过 id，不凭印象）：
#   · 尸潮的天数升档取自 **The Hordes 自己的生成表**
#     （`config_defaults/data/hordes/horde_data/tables/default.json` 与 `mixed_mobs.json`，
#      格式是 `id-权重-起始天-结束天`）：0~20 天只有僵尸；20~40 尸壳；
#      40+ 僵尸猪灵/僵尸马/僵尸疳；50+ 凋灵骷髅/卫道士/掠夺者/幻翼/唤魔者；60+ 猪灵蛮兵。
#      ——所以这一簇的击杀判据落在**原版生物**上，是这张表规定的，不是随手挑的。
#   · 天象取自 `data/enhancedcelestials/enhancedcelestials/lunar/event/*.json`：
#       blood_moon：chance 0.1、min_number_of_nights_between 4、blocks_sleeping、
#       force_surface_spawning（**地表强制刷怪，亮度不管用**）；
#       harvest_moon：drops.drop_enhancer 对 `#enhancedcelestials:harvest_moon_crops` 是 2.0（掉落翻倍）；
#       super_moon：配置项 `slimes_spawn_everywhere`（提示文案就是"附近开始刷史莱姆"）；
#       blue_moon：运气（提示文案"你觉得运气不错"）。
#   · 掠夺者兵种用 `takesapillage:<兵种>` 击杀（实体名取自它自己的
#     `data/takesapillage/loot_table/entities/{archer,legioner,skirmisher,clay_golem}.json`
#     与 lang 的 `entity.takesapillage.*`）。
#   · 原版统计：`time_since_rest`（距上次休息）/ `sleep_in_bed` / `fish_caught` /
#     `raid_trigger` / `play_time` —— 全部在 `QUESTBOOK-CRITERIA.md` §二 的实测清单里。
#
# **checkmark**：本章 0 条。`tools/questbook_check.py` 的第 ⑥ 项只放行 `CHECKMARK_EXCEPTIONS`
# 里登记过的 name，本章不在名单里 —— 所以"没有信号"的条目一律改用**实物或统计**表达，
# 不用自检格（结果是这三条自检都能 exit 0）。
#
# ⚠️ 一条存疑项（留给做验收的人）：`minecraft:blackstone` 与 `space_moss_block` 是
# EC 天象留下的实物，本章拿它们当判据。两个 id 在注册表里是**确定存在**的（item_index 查得到），
# 但"陨石落地后能不能用镐子挖走"这件事我**没有在游戏里实测**（本机没有可开的世界）——
# 若挖不动，那是玩法侧的问题，不是 id 写错，改判据即可。

key = "cat_horde"
title = "尸潮与夜袭"
subtitle = "夜里的规则、天象、成群来的东西，以及天亮之后"
group = "category"
icon = "minecraft:zombie_head"
order_index = 63

grid = { step = 1.5, row_h = 1.75 }

