# ================= 追加：重工业与材料体系（2026-09-22）=================
# 这一轮加的是「原木—石料—砖」之外的另一半：**金属、油、化工、规格**。
# 判据用到的 mod（都是实物，逐个核过 id：`tfmg` 656 项 / `create` 901 项）：
#   · `tfmg`（The Factory Must Grow）：本章最大的一块簇 —— 焦炉→高炉→炼钢→铸件、
#     油田→抽油机→分馏→燃料与化工、塑料与合成材料、管线与重工业厂房。
#   · `create`：合金与压片（黄铜、金属板、光耀/暗影钢）。
#   · 原版：金、下界合金、远古残骸。
#
# **跨章边界（写清楚，避免与 `64-create-decor` 打架）**：
#   · `64-create-decor` 用 TFMG 的**建材与装饰**视角（混凝土、警示块、工厂地板这类表皮）。
#   · 本章用 TFMG 的**加工链**视角（矿→锭→构件→成品）。同一 mod 两章各写一半，
#     这是 ROSTER §4.1 那张例外表之外新加的一条，需要汇总者登记。
#   · Create 机器内部的工序仍然不在本章（那是 `60-create` / `62-logistics`）。

# ---------------- 簇 6：重工业（TFMG · 含 Create 合金与压片） ----------------

