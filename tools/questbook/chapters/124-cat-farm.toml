# 类目 · 农牧与种植
#
# 本章的 mod：Farming for Blockheads（三档肥料 · 肥沃耕地 · 鸡窝 · 饲养槽）·
#   Smarter Farmers（农夫村民收完自己补种）· RightClickHarvest（右键收割并补种）·
#   Ecologics（杜鹃 / 椰树 / 核桃 / 仙人掌果 · 企鹅 · 椰子蟹）·
#   Naturalist（野生动物：鹿 · 熊 · 河马 · 长颈鹿，以及捕网与标本工具）·
#   More Villagers（八种新村民职业与工作站）· Spice of Life: Carrot Edition（食物清单）
#
# 与其它章的分工：
#   · 食物与烹饪章 = 从食材到菜（厨具、菜谱、酒、各维度食材）
#   · 本章         = 从种子到食材（地、肥料、牲畜、村民、吃法）
#   · 基建 / 出关章 = 农田与粮仓的**规模**（几百格的水浇地归那边）
#
# 两点说明：
#   1. 本包没有 Manure / Dynamic Trees / Bushy Leaves（pack/mods 下无对应文件），
#      故本章没有它们的条目；ROSTER 里这三行是备选清单，未采用。
#   2. RightClickHarvest 与 Smarter Farmers 不注册任何物品，也就没有物品判据；
#      这两条改用「同一件事的游戏信号」（种下种子 / 农夫的工作站）判定。
#
# 奖励只给三个簇头与终局（§3）：三档肥料 · 捕网 · 食物清单 · 饭桌不再靠运气。

key = "cat_farm"
title = "农牧与种植"
subtitle = "把种子、牲口与人手接成一条稳定的食物线"
group = "category"
icon = "minecraft:wheat"
order_index = 55

grid = { step = 1.5, row_h = 1.75 }

