	"桶比箱子好：**闭着眼也知道哪一格是什么**（配合牌子）。",
]
icon = "minecraft:barrel"
shape = "square"
deps = ["lg_chiseled_shelf"]
tasks = [
	{ type = "item", item = "minecraft:barrel", count = 12 },
]

