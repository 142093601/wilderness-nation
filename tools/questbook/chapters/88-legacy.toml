# 编年 · 碑林与史册
#
# 为什么最后一章是这个
# --------------------
# 这个包的自我定义不是"造得最多"，而是"**记得住**"（`DESIGN.md` 里那条：
# 「碑林：每次时代推进，在碑旁加一块历史碑 —— 一串碑就是可以散步读的编年史」）。
# 「文明」章已经把碑林当成一个**完成的建筑**在做；这一章做的是**制度**：
# 一块碑记什么、一册书怎么写、一个人怎么被记住、以及**怎么交给下一批人**。
#
# 与其它章的分工：
#   · 文明   = 碑林作为**建筑**（规模、排布、美观）
#   · 本章   = 碑林作为**制度**（记什么、谁记、以后谁读）
#
# 判据：碑（凿制石砖）、册（成书/书架）、像（盔甲架/展示框）、图（地图）的实物。
# 没有一条 checkmark —— "写了什么"判不了，但"有没有那个东西"判得了。

key = "legacy"
title = "碑林与史册"
subtitle = "让后来的人知道这里发生过什么"
group = "chronicle"
icon = "minecraft:chiseled_stone_bricks"
order_index = 11

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：碑（记一件事） ----------------

[[quest]]
name = "lg_first_stele"
title = "第一块碑"
desc = [
	"碑不是装饰：**一块碑 = 一件事 + 一个时间 + 一群人**。",
	"凿制石砖起座，规模随事情大小定，但位置要固定 —— 碑林是一条能走的路，不是一堆石头。",
]
icon = "minecraft:chiseled_stone_bricks"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "minecraft:chiseled_stone_bricks", count = 4 },
]

[[quest]]
name = "lg_stele_text"
title = "碑上要有字"
desc = [
	"没有字的碑只是石头。挂牌、刻字、嵌展示框都行 —— 关键是**路过的人不用问就知道**。",
]
icon = "minecraft:dark_oak_sign"
shape = "rsquare"
deps = ["lg_first_stele"]
tasks = [
	{ type = "item", item = "minecraft:dark_oak_sign", count = 4 },
]

[[quest]]
name = "lg_stele_date"
title = "记下时间"
desc = [
	"「第三年秋」比「很久以前」有用得多。游戏里没有历法，所以时间要自己定 ——",
	"**从你们决定建国的那一天起算**。",
]
icon = "minecraft:clock"
shape = "circle"
size = 1.2
deps = ["lg_first_stele"]
tasks = [
	{ type = "item", item = "minecraft:clock" },
]

[[quest]]
name = "lg_stele_light"
title = "碑前长明"
desc = [
	"碑林要能夜里读：魂灯不熄，也压得住刷怪。",
]
icon = "minecraft:soul_lantern"
shape = "circle"
size = 1.2
deps = ["lg_first_stele"]
tasks = [
	{ type = "item", item = "minecraft:soul_lantern", count = 4 },
]

[[quest]]
name = "lg_stele_row"
title = "碑排成林"
desc = [
	"十块以上才叫「林」。**每个时代至少一块**——这是这个包对自己那段历史的记法。",
]
icon = "minecraft:chiseled_stone_bricks"
shape = "square"
deps = ["lg_stele_text"]
tasks = [
	{ type = "item", item = "minecraft:chiseled_stone_bricks", count = 24 },
]

[[quest]]
name = "lg_stele_path"
title = "碑林有路"
desc = [
	"碑林是给人走的：铺路、修台阶、留座位。参观动线本身也是设计的一部分。",
]
icon = "minecraft:stone_bricks"
shape = "square"
deps = ["lg_stele_row"]
tasks = [
	{ type = "item", item = "minecraft:stone_bricks", count = 32 },
	{ type = "item", item = "minecraft:stone_brick_stairs", count = 8 },
]

[[quest]]
name = "lg_stele_shrine"
title = "碑林有中心"
desc = [
	"碑林需要一个视觉中心：一座主碑或一座亭子把整片收住。",
]
icon = "minecraft:quartz_block"
shape = "rsquare"
deps = ["lg_stele_path"]
tasks = [
	{ type = "item", item = "minecraft:quartz_block", count = 16 },
]

