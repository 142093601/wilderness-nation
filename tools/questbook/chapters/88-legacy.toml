	"写给**下一个人**的那一册：城里有什么、东西在哪、哪些事还没做完、哪些坑别再踩。",
	"这是全包里唯一一条「为了你不在的时候」写的任务。",
]
icon = "minecraft:book"
shape = "rsquare"
deps = ["lg_archive_room", "lg_map_archive"]
tasks = [
	{ type = "item", item = "minecraft:book", count = 8 },
]

[[quest]]
