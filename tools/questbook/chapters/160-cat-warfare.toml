# 类目 · 战斗与军械
#
# 本章的 mod（逐个核对过：`python tools/item_index.py --ns <ns>` → tools/out/P-*.txt）：
#   · Hundred Years Warfare `hundred_years_war`（269 项：部队卷轴 · 指挥杖 · 补给点 /
#     生成点 / 仓库控制 / 仓库存储 / 运输指令 · 六种工作站 · 弩炮 / 轻型投石机 / 攻城塔 /
#     手推炮 · 长矛 / 骑枪 / 军刀 / 弯刀 / 镰形剑）
#   · Epic Knights（mod id = `magistuarmory`，720 项：钢制武器 · 四种盾形 × 各材质 ·
#     骑枪 · 马铠 · 马衣图案与马装饰）
#   · Medieval Siege Machines `siegemachines`（18 项；本章只取**守城视角**的三件）
#   · It Takes a Pillage `takesapillage`（7 项 + 5 条进度）
#   · Better Combat（战斗手感，无物品）
#   · Simply Swords `simplyswords`：武器与独特武器归 `140-cat-gear`，本章不重复
#
# 与相邻章的分工（只在这里划边界，不动别人的文件）：
#   · `140-cat-gear`   = 一个人的装备：拿什么、穿什么、怎么附魔、怎么修
#   · `54-conquest`    = **进攻方**：siegemachines 那几台机器怎么造、怎么拿来夺城
#   · `70-defense`     = 工事与自动化防御：墙、机关、照明、固定炮座、弹药后端
#   · `55-defense-era` = 国策与达标线：编制名册、储备规格、伤亡与复盘
#   · 本章             = 军械列装 · 军阵编制 · 器械与后勤 · 反制与善后
#                        （一支部队用什么、怎么编、走多远、挨打之后怎么办）
#
# 判据来源（逐条查过 id，不凭印象）：
#   · HYW 的部队卷轴（`scroll_*`）、指挥杖、补给点、生成点、仓库控制/存储、运输指令、
#     六种工作站都是**真实注册物品** —— 所以「编制」与「后勤」这两层判得了
#   · 掠夺者兵种用 `takesapillage:<兵种>` 击杀（实体名取自它自己的
#     `data/takesapillage/loot_table/entities/*.json` 与 lang 的 `entity.takesapillage.*`）
#   · 靶场用原版统计 `minecraft:target_hit`（`QUESTBOOK-CRITERIA.md` §二 实测存在）
#
# ⚠️ 两个坑，下一任作者别再踩：
#   1) `magistuarmory:*_blocking` 与 `*_raised`，以及裸的 `kiteshield` / `roundshield` /
#      `heatershield` / `ellipticalshield`，**只是模型状态、不是注册物品**（jar 内 lang 键
#      为 0；`models/item/iron_estoc.json` 用 overrides 指向 `iron_estoc_blocking`）。
#      把这类 id 写进 tasks，任务永远做不完，理由见说明书 §1.1。
#   2) `title` / `desc` 的值里不许出现英文双引号，中文引号用「」。
#
# 已知的跨章重复（不在本章可改范围内，留给汇总的人处置）：
#   `w_pillager_camp` / `w_bastille` 用的两条 `takesapillage:adventure/*` 进度，
#   与 `70-defense` 的 `raid_camp` / `raid_stronghold` 完全相同 → 两处会同时亮。

key = "cat_warfare"
title = "战斗与军械"
subtitle = "从一把好剑，到一台能砸开城门的机器"
group = "category"
icon = "magistuarmory:steel_chainmail"
order_index = 62

grid = { step = 1.5, row_h = 1.75 }

