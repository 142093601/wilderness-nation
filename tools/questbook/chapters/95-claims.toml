shape = "rsquare"
deps = ["boundary_post"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "alley_check"
title = "试一次越界"
desc = [
	"让一个非成员去试着拿走仓库里的东西——**能拦住才算这套系统真的生效**。",
	"这一条是设计里 A1 的验收项（`DEFERRED.md` 记着它需要两个真实玩家）。",
	"⚠️ 自检。",
]
