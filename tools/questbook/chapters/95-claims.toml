# 领地与队伍（技艺章）
#
# 定位：OPAC（认领）+ FTB Teams（队伍）+ 传送网络 —— 「我们的地」这套系统怎么用起来。
#
# ⚠️ **这一章的判据限制必须写在最前面**
#    实测：`openpartiesandclaims` 与 `ftbteams` **完全不提供物品**
#    （`python tools/item_index.py --ns openpartiesandclaims` → hits 0；
#      `--ns ftbteams` → hits 0；两个命名空间的 advancement 也是 0 条）。
#    它们只有命令与界面。所以「圈地」「组队」「改权限」这些**动作**在 FTB Quests 里
#    **没有判据**，只能用 checkmark 并列明理由。
#    能自动判的是这一章里**真实物品**的部分：传送石 / 共享石碑 / 传送石座 / 卷轴 /
#    传送粉 / 共鸣碎片 / 智能过滤器 / 原版的界桩与告示牌。
#
# 覆盖的命名空间与条数（全部核过）：
#   · `waystones`（63 个 id，**本章铺满条数的主力**，用到 31 个）：各色 waystone ·
#     sharestone 全 16 色 · portstone 全 16 色 · warp_stone / warp_plate / warp_dust ·
#     warp_scroll(+bound) / bound_scroll / return_scroll / blank_scroll / portal_scroll ·
#     attuned_shard / dormant_shard / crumbling_attuned_shard / deepslate_shard ·
#     warp_portal · epitaph / fleeting_memorial / twinbound_feather
#   · `ftbfiltersystem`（1 个 id：smart_filter）——「谁能拿什么」的实物落点
#   · `openpartiesandclaims`（无物品 → 见上，全部走 checkmark 并写明理由）
#   · `ftbteams`（无物品、无进度 → 只有命令，同样走 checkmark 并写明理由）
#   · `minecraft`：旗帜 / 木牌 / 告示牌 / 钟 / 望远镜 / 铁栏杆 / 橡木栅栏（界桩与规矩的载体）
#   · `createrailwaysnavigator:navigator`：驿站名册的载体（跨 mod 复用一件实物）
#
# 与「编年 · 立国」和「编年 · 立约」的分工：
#   那两章讲**什么时候做**（什么时候划界、什么时候立约）；本章讲**怎么把它用起来**。
#
# checkmark 清单（7 条，逐条给理由）：
#   · claim_anatomy —— 圈地动作，OPAC 无物品无进度
#   · boundary_rules —— 文本约定，游戏里没有信号源
#   · role_split —— 权限档位，OPAC 无物品无进度
#   · alley_check —— 需要第二个真实玩家配合（DEFERRED.md 记着它）
#   · shared_chest —— 约定，不是技术动作
#   · claims_charter —— 文本，且写在不同载体上
#   · conflict_protocol —— 处置流程，同样没有信号源

key = "claims"
title = "领地与队伍"
subtitle = "「我们的地」这套系统：权限、边界、以及走得回来"
group = "craft"
icon = "minecraft:shield"
order_index = 36
grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：边界 ----------------

[[quest]]
name = "claim_anatomy"
title = "先把边界画清楚"
desc = [
	"领地的价值不在「圈了多大」，而在**边界在哪**：让谁进、谁不能拆、谁不能开箱。",
	"⚠️ OPAC 不提供物品（实测 hits 0），所以这一条自检。",
	"验收方式：找一个不在队里的人，让他试三件事——挖、放、开箱。三件都被拦才算过。",
]
icon = "minecraft:white_banner"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "boundary_post"
title = "界桩"
desc = [
	"线上看不见的边界，地上得看得见：四角立界桩，进出挂木牌。",
	"界桩是给**自己人**看的——不然新成员根本不知道哪里能挖。",
]
icon = "minecraft:oak_sign"
shape = "rsquare"
deps = ["claim_anatomy"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 8 },
	{ type = "item", item = "minecraft:oak_fence", count = 32 },
]

[[quest]]
name = "boundary_rules"
title = "边界规矩写下来"
desc = [
	"边界不是一次画完的：路要延伸、田要扩建、矿口要外移。",
	"把「怎么改边界、谁来批」写成条文挂在议事厅，后面就不会为一条路吵三次。",
	"⚠️ 文本约定，游戏里没有信号源，自检。",
]
