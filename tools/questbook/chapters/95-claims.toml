[[quest]]
name = "portal_scroll"
title = "跨维度卷轴"
desc = [
	"门卷轴把网络伸到别的维度：下界、末地的前哨也能挂在自己这张网上。",
]
icon = "waystones:portal_scroll"
shape = "circle"
size = 1.2
deps = ["waystone_layers_deep"]
tasks = [
	{ type = "item", item = "waystones:portal_scroll" },
]

[[quest]]
name = "warp_portal"
title = "传送门"
desc = [
	"传送门是永久设施那一档：不用道具、不用卷轴，走进去就走。",
	"网络建到这一步，才算真的「基础设施」。",
]
icon = "waystones:warp_plate"
shape = "rsquare"
deps = ["portal_scroll", "shard_deepslate", "portstone_colored"]
tasks = [
	{ type = "item", item = "waystones:warp_plate" },
]

[[quest]]
name = "waypoint_markers"
title = "驿站名册"
desc = [
	"每座石挂一块告示牌：名字、归属、开放对象。",
	"没有名字的传送石，在列表里就是一串坐标。",
]
icon = "minecraft:oak_sign"
shape = "circle"
size = 1.2
deps = ["waystone_network"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 8 },
]

[[quest]]
name = "waystone_loss"
title = "石被拆了怎么办"
desc = [
	"网络最怕的不是没建，是**建好了被人拆掉**：谁有权拆、拆了怎么补，要事先说清。",
	"墓地铭牌与瞬忆碑是这套系统里跟「失去」有关的实物：",
	"它们提醒所有人，传送点是资产，不是地砖。",
]
icon = "waystones:epitaph"
shape = "circle"
size = 1.2
deps = ["waystone_network"]
tasks = [
	{ type = "item", item = "waystones:epitaph" },
	{ type = "item", item = "waystones:epitaph" },
]

[[quest]]
name = "twinbound_feather"
title = "双生羽毛"
desc = [
	"双生羽毛是「两个人共用一条线」的实物：它把同行这件事做成了一个道具。",
]
icon = "waystones:twinbound_feather"
shape = "circle"
size = 1.2
deps = ["warp_portal"]
tasks = [
	{ type = "item", item = "waystones:twinbound_feather" , count = 4 },
]

# ---------------- 簇 4：冲突与规矩 ----------------

[[quest]]
name = "claims_monument"
title = "国土成型"
desc = [
	"把即时通讯、传送、权限三样凑齐，领地才算「国土」而不是「一块安全区」。",
]
icon = "minecraft:bell"
shape = "pentagon"
size = 2.0
deps = ["claims_charter", "warp_portal", "twinbound_feather", "waypoint_markers",
        "waystone_loss"]
tasks = [
	{ type = "item", item = "minecraft:bell" },
]
rewards = [
	{ type = "xp", xp = 80 },
	{ type = "toast" },
]

[[quest]]
name = "conflict_protocol"
title = "冲突处置"
desc = [
	"越界、拆错、拿错——事先写清「谁受理、怎么判、怎么补」。",
	"公告牌是这套流程的载体：判罚要贴在所有人看得见的地方。",
	"⚠️ 流程本身没有信号源，自检。",
]
icon = "minecraft:bell"
shape = "rsquare"
deps = ["claims_monument"]
tasks = [
	{ type = "checkmark" },
]

[[quest]]
name = "conflict_evidence"
title = "取证"
desc = [
	"望远镜是这套系统里唯一能用来「先看清楚再说话」的工具。",
	"有取证工具，冲突才不会全变成嗓门大小的比较。",
]
icon = "minecraft:spyglass"
shape = "circle"
size = 1.2
deps = ["conflict_protocol"]
tasks = [
	{ type = "item", item = "minecraft:spyglass" },
]

[[quest]]
name = "eviction"
title = "外人处置"
desc = [
	"来了个不在队里的人：先拦住、再讲规矩、最后才是处理。",
	"顺序不能反——先动手的队伍，规矩就立不住了。",
]
icon = "minecraft:iron_bars"
shape = "circle"
size = 1.2
deps = ["conflict_evidence"]
tasks = [
	{ type = "item", item = "minecraft:iron_bars", count = 16 },
	{ type = "item", item = "minecraft:chain", count = 8 },
]

[[quest]]
name = "public_amenities"
title = "领地内的公共设施"
desc = [
	"一块地只有仓库和城墙，那只是工地。",
	"把钟、灯笼、告示牌摆进来，领地里才有「住」这件事。",
]
icon = "minecraft:lantern"
shape = "rsquare"
deps = ["eviction"]
tasks = [
	{ type = "item", item = "minecraft:lantern", count = 8 },
	{ type = "item", item = "minecraft:bell" },
]

[[quest]]
name = "public_rules"
title = "把规矩写下来"
desc = [
	"告示牌挂到每一个路口：这里能不能挖、能不能盖、能不能过夜。",
	"条文一旦写在牌子上，就不需要每次由人复述一遍。",
]
icon = "minecraft:oak_sign"
shape = "rsquare"
deps = ["public_amenities"]
tasks = [
	{ type = "item", item = "minecraft:oak_sign", count = 8 },
]

[[quest]]
name = "territory_done"
title = "这块地是「我们的」"
desc = [
	"边界清楚、队伍分层、传送成网、规矩上榜——**四样齐了**才叫领地。",
	"到这个阶段，新成员进来不需要人带：界桩告诉他范围，站牌告诉他规矩，",
	"传送石告诉他怎么走。制度开始替人干活了。",
]
icon = "minecraft:beacon"
shape = "hexagon"
size = 2.5
deps = ["public_rules", "public_amenities"]
tasks = [
	{ type = "item", item = "minecraft:beacon" },
]
rewards = [
	{ type = "xp", xp = 120 },
	{ type = "toast" },
]
