# 蒸汽与铁路（技艺章）
#
# 这一章补的是 PLAN-questbook.md §2.1 里「技艺 5 章」的第 5 章。
# 它独立成章的理由：Create 的**蒸汽与列车**是一整套自成体系的大件——
# 有燃料、有锅炉、有轨道与信号、有调度，玩法上与其他机器完全不同类。
#
# 判据来源：**实物**（全部用 `python tools/item_index.py --ns <ns>` 核过）。
# 覆盖的命名空间：
#   · `railways`（Steam 'n' Rails，1951 个 id，本章主力）：轨距与轨道类型 · 道岔与交叉 ·
#     车钩与缓冲 · 转向架与车架部件 · 烟囱与阀动装置 · 列车长帽与行车哨
#   · `createrailwaysnavigator`（10 个 id）：导航仪 · 站钟 · 高级显示面板族
#   · `create_train_parts`（16 个 id）：伸缩踏板 · 列车台阶 · 滑动窗 · 道口闸门 · 延长杆
#   · `create_bb`（Blocks & Bogies，31 个 id）：转向架样式与轴数。该 mod **只有方块、
#     没有对应物品**——实测它 31 个方块的战利品表全部掉 `create:railway_casing`，
#     所以这一簇的判据落在铁壳上，图标才用它自己的方块。
#   · `create`：轨道 / 站点 / 信号机 / 列车门与活板门（本体机制归 `60-create`，
#     本章只取它们作为「铁路系统的骨架件」）
#
# 与 `60-create` 的分工（**避免重复讲同一件事**）：
#   60 章已经写过 `steam_engine` / `steam_whistle` / `railway` / `track_station` /
#   `track_signal` / `conductor` / `long_train` / `train_portal` / `track_observer` /
#   `schedule` 这十条**入门动作**（第一次点火、第一段轨、第一座站、第一张时刻表）。
#   本章不复述那十条，只写**接着往下走的那一层**：轨距体系、道岔与闭塞、
#   车钩与编组、转向架与阀动装置、月台与站房、装卸与检修、长大交路。
#
# 与 `62-logistics` 的分工：那一章讲产线吞吐（打包机与蛙口港）；本章的「装卸」只讲
# 车站月台上的那一套（货运月台、道口、机车牵引），不重复打包机的机制。

key = "steam"
title = "蒸汽与铁路"
subtitle = "从烧一炉水，到让整张地图变短"
group = "craft"
icon = "create:steam_engine"
order_index = 34
grid = { step = 1.5, row_h = 1.75 }

