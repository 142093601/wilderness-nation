# 类目 · 信息与界面
#
# 本章的 mod（13 个 + 1 个扩展）：
#   看信息   Jade（+ Jade Addons）· BetterF3 · AppleSkin · Item Highlighter ·
#            Legendary Tooltips · Better Advancements · Chat Heads
#   操作手感 Controlling · Mouse Tweaks · Crafting Tweaks · Ping Wheel · 3D Skin Layers
#   可读性   Colorful Hearts
#
# 与其它章的分工：
#   · Xaero 小地图/世界地图与区域标题 = 150-cat-explore
#   · JEI 配方查询与贸易辅助        = 134-cat-trade
#   · 性能、崩溃与卡顿排查          = 170-cat-perf
#   · 本章                          = 屏幕上的信息怎么读、操作怎么省事
#
# ⚠️ 本章的判据来源：
#   本章 mod **全是纯客户端界面 mod**，注册表 100 个命名空间里一个都没有
#   （实测 `python tools/item_index.py --stats`；其中多项在 modlist.tsv 里还是 plan 状态）。
#   界面开关既没有注册物品，也不进任何统计，所以 mod 条目一律 checkmark 并在每条上方
#   写明理由；凡能落到「手上真的拿着某样东西」的信息类条目，一律用实物判据。

key = "cat_client"
title = "信息与界面"
subtitle = "屏幕上该看见什么、手上该怎么操作"
group = "category"
icon = "minecraft:item_frame"
order_index = 65

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：看信息 ----------------

# checkmark：Jade 是纯客户端界面 mod，注册表里没有 jade 命名空间（实测 0 物品），
# 「指着方块弹面板」这个动作没有物品或统计信号。
[[quest]]
name = "c_jade"
title = "指着方块就显示信息：Jade"
desc = [
	"这一簇解决一件事：**眼前这个东西是什么、它现在什么状态**。",
	"Jade 是这里的第一块：不看它，很多方块只能靠试。",
]
icon = "minecraft:spyglass"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "checkmark" },
]

# checkmark：Jade Addons 是 Jade 的信息扩展，同为客户端界面，无物品无统计。
[[quest]]
name = "c_jade_addons"
title = "给 Jade 补信息源：Jade Addons"
icon = "minecraft:item_frame"
shape = "circle"
size = 1.2
deps = ["c_jade"]
tasks = [
	{ type = "checkmark" },
]

