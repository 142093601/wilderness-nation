# 类目 · 建筑与装饰
#
# 类目章的作用（PLAN-questbook.md §2.1）：**保证每个有玩法内容的 mod 都有位置**。
# 同类 mod 各占一个**簇**，簇内 3~8 条——不按"每个 mod 2~4 条"敷衍。
#
# 本章的 mod：Macaw's 全家（桥/栅栏/家具/灯/画/路/活板门/窗）· Handcrafted ·
#             Refurbished Furniture · Chipped/Rechiseled（变体建材）· Amendments
#
# 判据：**全是实物**——这类 mod 的价值就是"提供方块"，判据自然是持有/放下它们。

key = "cat_building"
title = "建筑与装饰"
subtitle = "让「盖得像样」这件事有工具可用"
group = "category"
icon = "minecraft:bricks"
order_index = 30

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：结构与连接件（Macaw's） ----------------

[[quest]]
name = "b_bridge"
title = "桥与栈道"
desc = [
	"Macaw's Bridges：跨水、跨沟、跨谷。别再用一格宽的土路硬过。",
]
icon = "mcwbridges:acacia_log_bridge_middle"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "mcwbridges:acacia_log_bridge_middle", count = 8 },
]

[[quest]]
name = "b_fence"
title = "栅栏与围墙"
desc = [
	"Macaw's Fences：比你想象的多得多的栏杆样式。",
]
icon = "mcwfences:acacia_hedge"
shape = "circle"
size = 1.2
deps = ["b_bridge"]
tasks = [
	{ type = "item", item = "mcwfences:acacia_hedge", count = 16 },
]

[[quest]]
name = "b_window"
title = "窗"
desc = [
	"Macaw's Windows：一整套窗框与玻璃组合。房子有窗才像房子。",
]
icon = "mcwwindows:acacia_window"
shape = "circle"
size = 1.2
deps = ["b_bridge"]
tasks = [
	{ type = "item", item = "mcwwindows:acacia_window", count = 8 },
]

[[quest]]
name = "b_trapdoor"
title = "活板门与门面"
desc = [
	"Macaw's Trapdoors：门面细节最省力的一环。",
]
icon = "mcwtrpdoors:acacia_barn_trapdoor"
shape = "circle"
size = 1.2
deps = ["b_bridge"]
tasks = [
	{ type = "item", item = "mcwtrpdoors:acacia_barn_trapdoor", count = 8 },
]

[[quest]]
name = "b_path"
title = "路面与铺装"
desc = [
	"Macaw's Paths：让路看起来是修的，不是走出来的。",
]
icon = "mcwpaths:andesite_diamond_paving"
shape = "circle"
size = 1.2
deps = ["b_bridge"]
tasks = [
	{ type = "item", item = "mcwpaths:andesite_diamond_paving", count = 16 },
]

# ---------------- 簇 2：室内（Handcrafted / Refurbished） ----------------

[[quest]]
name = "b_couch"
title = "能坐下的地方"
desc = [
	"Handcrafted 的沙发与长凳——室内第一步不是摆家具，是让人有地方坐。",
]
icon = "handcrafted:acacia_couch"
shape = "rsquare"
deps = ["b_bridge"]
tasks = [
	{ type = "item", item = "handcrafted:acacia_couch", count = 2 },
]

[[quest]]
name = "b_bedroom"
title = "卧室成套"
desc = [
	"床头柜 + 床 + 柜子。让「住的地方」和「干活的地方」分开。",
]
icon = "handcrafted:acacia_nightstand"
shape = "circle"
size = 1.2
deps = ["b_couch"]
