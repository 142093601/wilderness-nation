	"桌子 + 四把椅子。食堂是「聚在一起」最便宜的载体。",
]
icon = "refurbished_furniture:acacia_table"
shape = "circle"
size = 1.2
deps = ["b_kitchen"]
tasks = [
	{ type = "item", item = "refurbished_furniture:acacia_table" },
	{ type = "item", item = "refurbished_furniture:acacia_chair", count = 4 },
]

# ---------------- 簇 3：材质变体（Chipped / Rechiseled） ----------------

[[quest]]
name = "b_variants"
title = "同一块砖的十种样子"
desc = [
	"Chipped / Rechiseled：把一种建材变成一堆变体。",
	"用法是「先做基准块，再在切石机里换款」——这是「不靠加 mod 也能有细节」的关键。",
]
icon = "minecraft:chiseled_stone_bricks"
shape = "rsquare"
deps = ["b_bridge"]
tasks = [
	{ type = "item", item = "minecraft:chiseled_stone_bricks", count = 16 },
	{ type = "item", item = "minecraft:stonecutter" },
]

[[quest]]
name = "b_glass"
title = "玻璃与装饰面"
desc = [
	"彩色玻璃、图案玻璃：现代感与教堂感的差别就在这一层。",
]
icon = "minecraft:glass_pane"
shape = "circle"
size = 1.2
deps = ["b_variants"]
tasks = [
	{ type = "item", item = "minecraft:glass_pane", count = 32 },
]

