# 类目 · 建筑构件
#
# 本章的 mod：Macaw's 全家（mcwbridges 桥 · mcwfences 栅栏与树篱 · mcwwindows 窗 ·
#   mcwpaths 路径铺装 · mcwtrpdoors 活板门 · mcwlights 灯具）· Chipped（样式变体）·
#   Rechiseled + Rechiseled: Create（雕刻）· FramedBlocks（框架方块）·
#   Create: Copycats+（伪装板）· Effortless Building（批量建造）
#
# 与其它章的分工：
#   · 本章 = **结构与构件**：墙、窗、门面、路、桥、变体面材、施工工具
#   · 104-cat-decor = **细节那一层**（摆件、画、附属物：绳索、旗帜、挂饰）
#   · 110-cat-furniture = **家具**（能坐、能睡、能收纳的那层）
#   · 64-create-decor（待写）= Create 系建材（Design n' Decor · Create: Framed · Slice & Dice）
#
# 覆盖说明（2026-09-22 实测，不是凭印象）：
#   · Every Compat (Wood Good)：全包只有 1 个注册项 everycomp:all_woods，其模型是
#     builtin/entity、无语言键、无配方（解包 everycomp-1.21-2.11.52 核对）——隐藏物品，
#     当判据就是永远做不完的任务，故本章不设条目。
#   · Diagonal Walls：pack 里有这个 mod，但它不带 assets/data，只在运行时注册方块，
#     registry.json 里查不到任何 id；本章用「斜置墙体」一条以原版方块为判据覆盖它的用途。
#   · Athena / Fusion：纯前置库（CTM 与连接材质），按 brief §6 不设条目。
#   · Macaw's Paintings / Medieval Paintings：只提供画图样，不注册物品
#     （解包核对：0 个物品模型、0 个 item 语言键），无法作为判据；画作线在 104-cat-decor。
#
# 判据：**全是实物**——这类 mod 的价值就是「提供方块」，判据自然是持有它们。

key = "cat_building"
title = "建筑构件"
subtitle = "让「盖得像样」这件事有工具可用"
group = "category"
icon = "minecraft:bricks"
order_index = 50

grid = { step = 1.5, row_h = 1.75 }

