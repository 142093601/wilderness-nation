# 类目 · 装饰与细节
#
# 本章的 mod：Supplementaries（绳索/旗帜/遮阳棚/罐/支架/滑轮/沙漏/保险箱/雕像 等附属物）·
#   Amendments（**加在原版方块上的那一层**：地毯台阶、吊顶旗帜、墙挂灯笼、染料锅、
#   药水锅、头颅烛台、悬挂花盆、多层蛋糕）· Handcrafted（柱饰檐饰、陶罐等木作摆件）·
#   Builders Crafts & Additions（店面：招牌、柜台、橱柜、木工台、支撑梁、木架、抱枕、街机）·
#   Immersive Paintings（自制画与涂鸦）
#
# 与其它章的分工（本章的定位一句话）：
#   · 本章 = **「让建筑好看」的那一层**：摆件、画、附属物、挂饰。
#   · 100-cat-building = **结构件**：墙、窗、门面、路、桥、变体面材（那些决定「立不立得住」的）。
#   · 110-cat-furniture = **家具**：能坐、能睡、能收纳的那层。
#   · 178-cat-audio（音画与氛围）= 声音与环境粒子，不碰摆放出来的实物。
#
# 覆盖说明（2026-09-22 实测，不是凭印象）：
#   · Amendments 只注册 2 个**物品**（amendments:dye_bottle / amendments:dragon_charge），
#     其余 50 条全是「无物品形态的方块」（解包核对：0 个物品模型）——它们的设计就是
#     「在原版方块上原地变形」（地毯 → 地毯台阶、灯笼 → 墙灯、旗帜 → 吊顶旗）。
#     所以本章这些条目以**原版投入物**为判据，而不是拿查不到的方块 id 硬写。
#   · Macaw's Paintings / Medieval Paintings：只提供画图样，不注册任何物品
#     （解包核对：mcw-paintings 里 0 个物品模型、0 个 item 语言键），判据写不出来；
#     它们的图样由「画框与图样」一条以原版画框提到。
#   · SpookyJams / Held / Placeable Blaze Rods / Bushy Leaves / Vertical Slabs Compat：
#     这几个 mod **不在本包**（pack/mods 下 231 个清单里逐个查过，registry.json 里那几条
#     是旧实例扫描的残留），故一律不写条目——写了就是永远做不完的任务。

key = "cat_decor"
title = "装饰与细节"
subtitle = "同一栋房子，细节决定它像不像有人住"
group = "category"
icon = "supplementaries:statue"
