# 类目 · 地图与导航
#
# 本章的 mod 家族（逐个核对过：`python tools/item_index.py --ns <ns>` + 逐个开 jar 看 `data/`）：
#   · Waystones `waystones`（63 项：石碑 9 种材质 · 传送石 / 传送粉 / 传送门 · 卷轴 5 种 ·
#     共享石碑 16 色 · 传送石座 16 色 · 碎片与纪念物）—— 本章条数的主力
#   · Explorer's Compass `explorerscompass`（1 件真物品 + 31 张动画帧；4 条进度）
#   · Nature's Compass `naturescompass`（1 件真物品 + 31 张动画帧；4 条进度）
#   · Player Tracking Compass `playertrackingcompass`（1 件：tracking_compass）
#   · Xaero's 小地图 / 世界地图 / XaeroPlus `xaerominimap` `xaeroworldmap` `xaeroplus`
#   · Traveler's Titles `travelerstitles` · Jade `jade`
#
# **本章唯一没有物品判据的一族**（实测证据，不是漏写）：
#   上面最后两行的五个 mod 全是纯客户端界面 mod。逐个开 jar 的结论：
#   `models/item/` 条目数 = 0、`blockstates/` = 0、`data/<ns>/worldgen/` 不存在，
#   注册表里 `xaerominimap` / `xaeroworldmap` / `xaeroplus` / `travelerstitles` 命名空间为空。
#   所以「装了小地图」「进新群系弹区域名」在游戏里没有可检测信号。
#   → 这五个 mod **只由簇 1 的第一条自检任务**（`e_client_tools`，已在
#     `tools/questbook_check.py` 的 `CHECKMARK_EXCEPTIONS` 里登记过）在正文里交代；
#     「看地图」这件事本身用**实物**表达：纸质地图 · 制图台 · 旗标 · 磁石。
#   → 本章**没有新增任何 checkmark**（全章 checkmark 仍只有 `e_client_tools` 一条）。
#
# 与其它章的分工：
#   · 出关 (`45-expedition`)        = 远征的**组织**（补给点、前哨、带回什么）
#   · 领地与队伍 (`95-claims`)      = 传送网络的**队伍权限面**（谁能用哪座石碑）
#   · 实用与奇物 (`144-cat-utility`) = Waystones 的**奇物层**（石盘、共鸣碎片、双生羽毛、墓志铭）
#   · 本章 = **看路与认路**：把地图画出来（簇 1）· 用罗盘找目标（簇 2）·
#     把路钉成网络（簇 3）· 走过的证据（簇 4）
#   ⚠️ 已知重叠（写给汇总的人，不是这一章能决定的）：Waystones 同时出现在
#     `95-claims` / `144-cat-utility` / 本章，而 `QUESTBOOK-ROSTER.md` §4.1 的
#     「一个 mod 只有一个家」例外表里**没有登记 Waystones**。三处的分工写在上面了，
#     要不要收进例外表由汇总的人拍板。
#
# 判据：除 `e_client_tools` 外全是实物（item）与原版/模组进度，进度 id 都对着
#   `tools/registry.json` 的 `advancements` 逐条核过。

key = "cat_explore"
title = "地图与导航"
subtitle = "先看见，再决定去哪：把未知变成已知"
group = "category"
icon = "minecraft:compass"
order_index = 60

grid = { step = 1.5, row_h = 1.75 }

# ---- 簇 1：地图 ----

[[quest]]
name = "e_client_tools"
title = "先把「看」的工具备齐"
desc = [
	"这个包里有一整套**客户端界面 mod**，它们不占物品栏、也不会出现在 JEI 里：",
	"· Xaero's 世界地图 / 小地图：自动生效，按快捷键打开",
	"· Jade：指着方块就显示它是什么",
	"· Traveler's Titles：进新群系/维度时屏幕上出现区域名",
	"· Explorer's / Nature's Compass：手里拿着才起作用（这两样是**真物品**）",
	"⚠️ 界面类工具没有物品判据（实测：这些 mod 的 item 键数为 0），所以这一条自检。",
]
