# 类目 · 贸易与工坊辅助
#
# 分工说明（本章的定位）：
#   本章 = 「别把时间浪费在查与找上」的那一层 —— **工具与信息**。
#   仓储本体（柜子、抽屉、保险库、背包内胆、Lootr 容器）在 `130-cat-storage`，不在本章。
#
# 本章的 mod 家族（逐个核对过注册表与 jar 内容）：
#   · 有实物、因此能当判据的只有两个：
#       - Trading Post `tradingpost`：只加了一个方块 `tradingpost:trading_post`（贸易台）
#       - FTB Filter System `ftbfiltersystem`：只加了一个物品 `ftbfiltersystem:smart_filter`
#   · **没有实物、因此本章覆盖不到**（不是漏写；jar 内 `assets/*/models/item/` 条目数实测为 0，
#     注册表里也没有它们的命名空间，游戏里更没有「看过界面」这类信号 —— 按说明书 §5 不硬凑，
#     也不改用 checkmark 凑数）：
#       jade · jei · jeresources · almostunified · polymorph · craftingtweaks ·
#       ftbjeiextras · highlighter(item-highlighter) · legendarytooltips · searchables ·
#       controlling · mouse-tweaks · shulkerboxtooltip · polyglottooltip · simplytooltips ·
#       jadeaddons
#   · 这些 mod 真正省时间的地方不落在物品上（点开界面就有），
#     所以本章用**原版那些被它们帮你看懂的台子与行为**来落地：
#     工作台配方书 · 制图台 · 讲台之外的资料层 · 铁砧 / 砂轮 / 切石机 / 锻造台 / 织布机 · 村民交易
#
# 三个簇：查配方与查信息 / 合成的摩擦 / 交易与物流辅助

key = "cat_trade"
title = "贸易与工坊辅助"
subtitle = "把查与找的时间省下来，用在建与做上"
group = "category"
icon = "tradingpost:trading_post"
order_index = 57

grid = { step = 1.5, row_h = 1.75 }

