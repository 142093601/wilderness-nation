# 编年 · 御敌（时代 4 · defense）
#
# 时代定义：`eras.json` → id=defense, name=御敌, durationHours=60, coefficient=1.60
#
# 本章的定位（**与相邻章的分工，先看这一段**）
# ------------------------------------------------------------
#   · **本章 = 国策·达标线**：这个时代要达成什么防御目标——人、编制、标准、验收
#   · `70-defense`（技艺）  = 系统层：工事怎么建、自动化怎么搭、照明预警怎么布
#   · `164-cat-horde`（类目）= mod 家族：The Hordes / Undead Nights 各自是什么
#     → 本章不介绍它们，只把它们的**配置数字**当标准依据
#   · `54-conquest`（邦交） = 攻城与属地治理；本章只写**与属地的联防**这一面
#   软链接，不做硬前置。
#
# 判据依据（逐条取过证，不凭印象）
# ------------------------------------------------------------
#   · `server/logs/hordes.log`（The Hordes 自己写的加载日志，2026-09-22 读到）：
#     注册名 `hordes:zombie_player` / `hordes:husk_player` / `hordes:drowned_player`；
#     免疫清单只有 `minecraft:enchanted_golden_apple`（150 tick）；
#     护甲抗感染表 leather 0.05 / iron 0.10 / diamond 0.15 / netherite 0.20 / wolf_armor 1.0；
#     感染转换表：村民→僵尸村民 0.15、掠夺者→僵尸村民 0.15、唤魔者 0.5、女巫 0.7
#   · `server/config/hordes-common.toml`：hordeSpawnDays=10、spawnAmount=15、
#     hordeSpawnMultiplier=1.05（每波 +5%）、hordeStartTime=18000（午夜）、
#     canSleepDuringHorde=false、zombiesBurn=false、infectPlayers=true
#   · `server/config/undeadnights-server.toml` 与同目录两份 json：
#     5 天一次尸潮夜、场上上限 80、`hordeMobsCanClimbEachOther=true`（叠罗汉爬墙）、
#     爆破僵尸带 `tnt:5`、尸潮僵尸白天不烧、
#     `blockLightLevelsInfluenceMonsterSpawns=false`（**光照拦不住尸潮**：
#     所以「把墙外点亮」是治安措施，不是防守方案）
#   · 原版统计与进度：bell_ring / raid_trigger / target_hit / walk_one_cm / deaths / mob_kills
#
# **checkmark**：本章只在两条**已登记过的旧条目**上用（`hold_a_wave`、`under_attack`，
# 理由写在那两条的注释里）。本次新增的条目一律用 kill / stat 落判据，**不新增自检格**。

key = "defense_era"
title = "御敌"
subtitle = "御敌：这个时代的达标线在哪——袭击规模会长，工事就得跟着长"
group = "chronicle"
icon = "minecraft:shield"
order_index = 6
grid = { step = 1.5, row_h = 1.75 }

