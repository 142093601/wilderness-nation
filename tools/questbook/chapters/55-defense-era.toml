# 判据说明：`hordes:zombie_player` 的**镇杀**判据写在 `70-defense.kill_zombie_player`。
# 同一章对（55 / 70）不放同一条击杀判据 —— 否则两条任务会在同一刻一起亮。
# 所以这一条的判据落在「收殓箱 + 遗物名册」，机制写在正文里。
[[quest]]
name = "relics"
title = "遗物收殓"
desc = [
	"死于感染的队友会变成 hordes:zombie_player，而且带走了自己的东西（zombiePlayersStoreItems = true）。",
	"把东西拿回来、记进名册，才算收殓完——镇杀那一步的判据在技艺章的「镇杀阵亡者的化身」。",
]
icon = "minecraft:chest"
shape = "rsquare"
deps = ["casualty_roll"]
tasks = [
	{ type = "item", item = "minecraft:chest" },
	{ type = "item", item = "minecraft:written_book" },
]

[[quest]]
name = "pension"
title = "抚恤"
desc = [
	"抚恤要定成规矩、从国库出，不能靠同队的人自己凑——这是国家行为与义气的分界。",
]
