shape = "circle"
size = 1.2
deps = ["casualty_roll"]
tasks = [
	{ type = "item", item = "minecraft:emerald", count = 32 },
	{ type = "item", item = "minecraft:hay_block", count = 16 },
]

[[quest]]
name = "after_action_review"
