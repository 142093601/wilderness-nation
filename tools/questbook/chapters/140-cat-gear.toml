# 类目 · 装备与武器
#
# 本章的 mod：Simply Swords（武器与独特武器）· Epic Knights（mod id = magistuarmory，
#   中世纪武器 / 护甲 / 盾）· Armor of the Ages（时代护甲）· Hundred Years Warfare
#   （只取个人兵器；军阵与攻城归战斗与军械章）· Enchanting Infuser · Enchantment
#   Descriptions · Easy Anvils · Curios · Better Combat（战斗手感，无物品）
#
# 与其它章的分工：
#   · 战斗与军械 = **军械与攻城**（钢制军械列装、投石机、撞门器、军事单位）
#   · 本章       = **一个人的装备**：拿什么、穿什么、怎么附魔、怎么修
#
# ⚠️ 命名空间提醒：Epic Knights 的 mod id 就是 magistuarmory（同一个 mod，不是两个；
#    实测 jar 内 modId = magistuarmory，displayName = Epic Knights: Shields, Armor and Weapons）。
#
# 判据来源：全是实物。Enchanting Infuser / Easy Anvils / Curios / Better Combat
#   这四个自己不注册物品（实测它们的命名空间里没有 item/block），
#   所以判据落在它们**改造的那件实物**上。

key = "cat_gear"
title = "装备与武器"
subtitle = "从「有一把趁手的」到「全队穿得住」"
group = "category"
icon = "simplyswords:iron_longsword"
order_index = 58

grid = { step = 1.5, row_h = 1.75 }

