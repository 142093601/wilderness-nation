# ---- 簇 5：维护与预案 ----

[[quest]]
name = "shield_wall"
title = "举盾"
desc = [
	"盾牌挡下的伤害游戏会记账——这是「你确实站在前面」的证据。",
]
icon = "minecraft:shield"
shape = "rsquare"
deps = ["first_wall"]
tasks = [
	{ type = "stat", stat = "minecraft:damage_blocked_by_shield", value = 200 },
]

[[quest]]
name = "first_blood"
title = "第一次交火"
desc = [
	"杀够 20 个——不是刷，是清掉围过来的那一圈。",
]
icon = "minecraft:iron_sword"
shape = "rsquare"
deps = ["first_wall"]
tasks = [
	{ type = "kill", entity = "minecraft:zombie", value = 20 },
]

[[quest]]
name = "many_kills"
title = "清场"
desc = [
	"外围总要有人清。累计一百个，说明这件事已经成了常态，不是偶然。",
	"清场做得越多，守城时正面压力越小——这是「打出去」的前提。",
]
icon = "minecraft:bow"
shape = "circle"
size = 1.2
deps = ["first_blood"]
tasks = [
	{ type = "stat", stat = "minecraft:mob_kills", value = 100 },
]

# 下面两条原先用 `takesapillage` 的两条进度（pillager_camp / bastille）当判据，
# 但那两条进度已经被 `160-cat-warfare` 的 `w_pillager_camp` / `w_bastille` 占用，
# 同一个进度会让两个任务在游戏里同时亮（跨章重复内容）。
# 改后只用**这两处结构本身**当判据（id 取自 jar 的
# `data/takesapillage/worldgen/structure/{pillager_camp,bastille}.json`），
# 不碰 `164-cat-horde` 的四种兵击杀与实物（ravager_horn / bastille_blues 都归它）。
# 结构判据 = 进到里面；游戏不记「拆掉结构」这个动作，所以第二条配一份破门物资。
[[quest]]
name = "raid_camp"
title = "找到他们的营地"
desc = [
	"只守不打，规模只会一直涨。先找到发起方在哪。",
]
icon = "minecraft:white_banner"
shape = "rsquare"
deps = ["many_kills"]
tasks = [
	{ type = "structure", structure = "takesapillage:pillager_camp" },
]

[[quest]]
name = "raid_stronghold"
title = "拆掉它"
desc = [
	"找到营地只是知道对手在哪；打掉它才算把这一轮攻势的根拔了。",
	"据点没了，下一波的规模会小一截——这是防守第一次真正变成反击。",
	"判据落在「进到堡垒里」加「带着破门的东西」：游戏没有「拆掉一座结构」这种统计。",
]
icon = "minecraft:crossbow"
shape = "rsquare"
deps = ["raid_camp"]
tasks = [
	{ type = "structure", structure = "takesapillage:bastille" },
	{ type = "item", item = "minecraft:tnt", count = 4 },
]

[[quest]]
name = "maintenance_round"
title = "定期检修"
desc = [
	"工事会坏：门被拆、栏杆缺一段、发射器空着。所以要有固定的检修动作与修具。",
	"检修的判据只能是「修具到位」——原版不记「修过墙」。",
]
icon = "minecraft:anvil"
shape = "pentagon"
size = 2.0
deps = ["line_main"]
tasks = [
	{ type = "item", item = "minecraft:anvil" },
	{ type = "item", item = "minecraft:grindstone" },
]
rewards = [
	{ type = "xp", xp = 30 },
	{ type = "toast" },
]

[[quest]]
name = "parts_store"
title = "备件库"
desc = [
	"备件要按「坏一次要换什么」来备，不是按种类堆满。",
]
icon = "create:item_vault"
shape = "rsquare"
deps = ["maintenance_round"]
tasks = [
	{ type = "item", item = "create:item_vault", count = 2 },
	{ type = "item", item = "minecraft:iron_ingot", count = 64 },
]

[[quest]]
name = "ammo_types"
title = "三种弹药"
desc = [
	"普通箭是消耗品，光灵箭用来标记，药箭用来处理成群的。",
	"只备一种，遇到特殊情况就没有牌可打。",
]
icon = "minecraft:spectral_arrow"
shape = "rsquare"
deps = ["maintenance_round"]
tasks = [
	{ type = "item", item = "minecraft:arrow", count = 128 },
	{ type = "item", item = "minecraft:spectral_arrow", count = 32 },
	{ type = "item", item = "minecraft:tipped_arrow", count = 32 },
]

# 以下四条用 kill 落判据：尸潮的生物由 mod 生成，但**击杀是可统计的事实**，
