	"铁傀儡不要工资、不会下线，是驻军里最便宜的一档。",
]
icon = "minecraft:carved_pumpkin"
shape = "circle"
size = 1.2
deps = ["line_main"]
tasks = [
	{ type = "item", item = "minecraft:iron_block", count = 16 },
	{ type = "item", item = "minecraft:carved_pumpkin", count = 4 },
]

[[quest]]
name = "golem_snow"
title = "雪傀儡哨"
desc = [
	"雪傀儡造不成伤害，但雪球有击退，能把爬上墙头的东西推下去。",
	"它怕雨——只放在有顶棚的墙段。",
]
icon = "minecraft:snow_block"
shape = "circle"
size = 1.2
deps = ["golem_iron"]
tasks = [
	{ type = "item", item = "minecraft:snow_block", count = 8 },
]

[[quest]]
name = "line_inner"
title = "内城第二道"
desc = [
	"外圈被撕开是迟早的事——undeadnights 的等级表里，破块档位最高到黑曜石（tier 4）。",
	"所以内城要有第二道门与街垒，把战场限制在两条街里。",
]
icon = "minecraft:iron_door"
shape = "rsquare"
deps = ["line_main"]
tasks = [
	{ type = "item", item = "minecraft:iron_door", count = 4 },
	{ type = "item", item = "minecraft:cobblestone_wall", count = 64 },
]

[[quest]]
name = "line_core"
title = "核心库地堡"
