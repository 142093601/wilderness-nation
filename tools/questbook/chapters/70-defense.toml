	"所以墙上要有对空的一层：瞭望、弩、以及能打到墙头以上的武器。",
]
icon = "minecraft:spyglass"
shape = "circle"
size = 1.2
deps = ["line_main"]
tasks = [
	{ type = "item", item = "minecraft:spyglass", count = 4 },
	{ type = "item", item = "minecraft:crossbow", count = 4 },
	{ type = "item", item = "minecraft:arrow", count = 64 },
]

[[quest]]
name = "golem_iron"
