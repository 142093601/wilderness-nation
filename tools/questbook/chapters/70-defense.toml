	"守城时它优先级最高：墙塌一段，后面就顾不上队形了。",
]
icon = "undeadnights:demolition_zombie_spawn_egg"
shape = "rsquare"
deps = ["kill_horde"]
tasks = [
	{ type = "kill", entity = "undeadnights:demolition_zombie", value = 5 },
