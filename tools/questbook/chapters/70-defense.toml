# ---- 终局 ----

# 判据理由（这一条**只能**用 checkmark）：
#   The Hordes / Undead Nights 都不发 advancement、也不注册自定义 statistic（实测），
#   「守住一次大规模袭击」这个**事件**在 FTB Quests 里没有信号源；
#   要自动判定需要 mod 侧提供「波次开始/结束」事件。
#   （`hold_the_line` 已在 questbook_check.py 的 CHECKMARK_EXCEPTIONS 里登记）
[[quest]]
name = "hold_the_line"
title = "守住一次真正的大规模袭击"
desc = [
	"全队协防、有人受伤、墙出现缺口又被补上——这一条游戏里没有信号源",
	"（The Hordes / Undead Nights 不提供进度或统计，实测）。所以它靠自己确认。",
	"⚠️ 想让这一步自动判定，需要 mod 侧给「波次开始/结束」事件——已记进待办。",
]
icon = "minecraft:shield"
shape = "hexagon"
size = 2.5
deps = ["wall_iron", "wall_lighting", "arrow_tower", "traps", "beacon_fire", "shield_wall"]
tasks = [
	{ type = "checkmark" },
]
rewards = [
	{ type = "xp", xp = 100 },
	{ type = "toast" },
]
