	"杀掉它，东西才拿得回来；这件事本身就是应急预案的一部分。",
]
icon = "minecraft:rotten_flesh"
shape = "rsquare"
deps = ["kill_horde"]
tasks = [
	{ type = "kill", entity = "hordes:zombie_player", value = 1 },
]

[[quest]]
name = "evac_plan"
