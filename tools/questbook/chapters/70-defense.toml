	"撤离要有终点：一个写在纸上、全队都知道的集合点。",
]
icon = "minecraft:written_book"
shape = "rsquare"
deps = ["maintenance_round"]
tasks = [
	{ type = "item", item = "minecraft:written_book", count = 2 },
	{ type = "item", item = "minecraft:white_bed", count = 4 },
]

[[quest]]
name = "bunker_food"
title = "地堡物资"
