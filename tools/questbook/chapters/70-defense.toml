	{ type = "item", item = "minecraft:dried_kelp_block", count = 16 },
]

[[quest]]
name = "fire_suppress"
title = "消防水路"
desc = [
	"木构与麻袋都怕火。软管滑轮 + 动力泵 + 储罐，是一条能直接拉到墙根的灭火线。",
