# 技艺 · 防御与尸潮
#
# 本章的定位（**与相邻章的分工，先看这一段**）
# ------------------------------------------------------------
#   · **本章 = 系统性**：防御是一套**可建造、可自动化、可维护**的设施
#     （工事 · 自动化 · 照明与预警 · 多道防线 · 维护与预案）
#   · `55-defense-era`（编年）= 国策与达标线：为什么要有国防、编制与标准在哪
#     → 本章**不写**「为什么要有国防」，也不写编制表
#   · `164-cat-horde`（类目）= mod 家族：The Hordes / Undead Nights 各自是什么
#     → 本章**不介绍**这两个 mod 的家族，只用它们的配置数字定工事规格
#   · `54-conquest`（邦交）= 攻城器械怎么造、怎么夺城
#     → 本章只用 `siegemachines` 的**守城**用法：炮座固定、器械架在墙上
#   · `takesapillage` 这个 mod **三章各用一半**（裁决结果）：`160-cat-warfare` 用它的两条
#     进度（`adventure/pillager_camp`、`adventure/bastille`）；`164-cat-horde` 用它的四种兵
#     击杀与实物（ravager_horn / bastille_blues）；本章只用它的**两处结构**
#     （`takesapillage:pillager_camp`、`takesapillage:bastille`）—— 同一个判据在两章出现，
#     两个任务会在游戏里同时亮
#   · `enhancedcelestials`（天象）**不在本章**：归 `164-cat-horde`（同一份裁决）
#   · `torchmaster` 归本章（`164-cat-horde` 已退让，不再写它）
#
# 判据依据（逐条取过证，不凭印象）
# ------------------------------------------------------------
#   · `server/logs/hordes.log`：注册名 `hordes:zombie_player`（感染概率 0.75）、
#     `hordes:husk_player`（0.8）、`hordes:drowned_player`（0.7）
#   · 尸潮的波次表（同一份日志）：`minecraft:phantom` 第 50 天起、
#     `minecraft:ravager` 第 50-50 天、`minecraft:evoker` 第 50-50 天——**规模是会长大的**
#   · `server/config/undeadnights-server.toml`：五日一次尸潮夜、场上上限 80、
#     尸潮僵尸不烧（hordeZombiesBurnInTheSun=false）、
#     `blockLightLevelsInfluenceMonsterSpawns=false` → **光照拦不住尸潮波次**
#   · `undeadnights_difficulty_config.json`：`hordeMobsCanClimbEachOther=true`（叠罗汉爬墙）、
#     `blockBreaking=false`（当前关着，但档位表到 4 = 黑曜石）、
#     `chanceForAdditionalWave=7`（每 45 秒有 7% 概率再来一波）
#   · `undeadnights_horde_mobs_config.json`：maxWaveSize=15、
#     精英僵尸 spawnChance=3、爆破僵尸 spawnChance=6 且 `extraSpawnInfo=tnt:5`
#   · `server/config/torchmaster.toml`：megaTorchRadius=64（立方）、
#     blockOnlyNaturalSpawns=true（只挡自然刷怪）、blockVillageSieges=true、
#     feralFlareRadius=16、feralFlareMinLightLevel=10、feralFlareLanternLightCountHardcap=255、
#     frozenPearlDurability=1024
#   · `hordes-common.toml`：`zombiesBurn=false`（原版僵尸白天也不烧）
#
# ⚠️ 真正「事件级」的目标（守住一次大规模袭击）在这一章里只有一条，用 checkmark ——
#    理由写在 `hold_the_line` 的注释里，且它已在 `tools/questbook_check.py` 的例外清单上。
#    本章新增的条目一律用 kill / stat / 实物判据，**不新增自检格**。

key = "defense"
title = "防御与尸潮"
subtitle = "御敌：来犯的怎么运作、怎么挡；有些结果判不了，得自己打勾"
group = "craft"
icon = "minecraft:shield"
order_index = 37
grid = { step = 1.5, row_h = 1.75 }

