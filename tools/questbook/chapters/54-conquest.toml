	"税率不能比母国高 —— 属地反叛的起点永远是税。",
]
icon = "minecraft:emerald_block"
shape = "rsquare"
deps = ["cq_appoint"]
tasks = [
	{ type = "item", item = "minecraft:emerald_block", count = 2 },
]

[[quest]]
