]
icon = "minecraft:written_book"
shape = "rsquare"
deps = ["cq_new_tax"]
tasks = [
	{ type = "item", item = "minecraft:written_book" },
]

[[quest]]
name = "cq_new_map"
title = "重画疆域"
icon = "minecraft:filled_map"
shape = "circle"
size = 1.2
deps = ["cq_register"]
tasks = [
	{ type = "item", item = "minecraft:filled_map", count = 2 },
	{ type = "item", item = "minecraft:cartography_table" },
]

[[quest]]
name = "cq_conquest_done"
title = "从一座城到一个国家"
desc = [
	"会打、能占、占得住、管得起 —— 邦交线到这里闭环：",
	"**外交拿不到的东西，战争能拿到；战争拿到的东西，治理才留得住。**",
]
icon = "minecraft:white_banner"
shape = "hexagon"
size = 2.5
deps = ["cq_loot", "cq_prisoner", "cq_new_map"]
tasks = [
	{ type = "item", item = "minecraft:white_banner", count = 8 },
]
rewards = [
	{ type = "xp", xp = 120 },
	{ type = "toast" },
]
