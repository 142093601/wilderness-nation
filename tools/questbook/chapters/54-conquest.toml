	"新属地要有**有人管**：一个讲台（办公桌）、一份任命书、一个常驻的人。",
]
icon = "minecraft:lectern"
shape = "rsquare"
deps = ["cq_rebuild"]
tasks = [
	{ type = "item", item = "minecraft:lectern" },
	{ type = "item", item = "minecraft:emerald", count = 16 },
]

[[quest]]
name = "cq_new_tax"
title = "新属地税则"
