# 技艺 · 机械动力·物流
#
# 本章的 mod：Create 本体（物流件）——所有判据来自 `create` 命名空间，
# 已用 `python tools/item_index.py --ns create --out tools/out/Q-create.txt` 逐条核对（901 项）。
#
# 与其它章的分工（**这条最重要，写之前逐条对过**）：
#   · `60-create` 已经写过这些机器**是什么**：第一条传送带 · 溜槽 · 置物台 · 黄铜漏斗 ·
#     智能溜槽 · 物品保险库 · 仓储与打包 · 库存清单 · 蛙口包站 · 机械臂 · 流体管道 ·
#     动力泵 · 流体储罐。**本章一条都不重复"它是什么"**。
#   · `130-cat-storage` = 放东西那一段（随身 / 就近 / 回仓 / 每人一份的战利品）。
#   · `75-steam`      = 列车 · 车站 · 时刻表 · 信号 · 导航（本章不写列车）。
#   · **本章 = 系统层**：把已有的零件组织成一条不卡的产线。所以每条的题目都是
#     系统口径（带路分流 / 按地址投递 / 堵塞在哪一段 / 每小时多少件），不是机器名。
#
# 本章唯一的指标是**吞吐量**（单位时间的件数），不是"能不能放进去"。
# 判据全部是实物（item）。**checkmark = 0**：本章没有一条需要靠"自己说做完了"。
#
# 条数：43（簇 1 搬运 9 · 簇 2 分流与分拣 10 · 簇 3 包裹与地址 10 ·
#            簇 4 库存与请求 8 · 簇 5 节拍与吞吐 6）。形状：五边形 5（每簇头一条）·
# 八边形 4（章内里程碑）· 六边形 1（终局，放最后）。

key = "logistics"
title = "机械动力·物流"
subtitle = "物料在机器之间怎么走，以及这条线每小时能过多少件"
group = "craft"
icon = "create:belt_connector"
order_index = 32

grid = { step = 1.5, row_h = 1.75 }

# ---- 簇 1：搬运 ----

[[quest]]
name = "lg_belt_line"
title = "主干带路"
desc = [
	"一整条线上，带只走一个方向，中途不改道。",
	"往返混线的第一段带出多少件，决定了整线的上限。",
]
icon = "create:belt_connector"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "create:belt_connector", count = 16 },
]
rewards = [
	{ type = "xp", xp = 30 },
	{ type = "toast" },
]

[[quest]]
name = "lg_belt_speed"
title = "带速就是吞吐"
desc = [
	"转速直接写在带速上，带速乘上间距才是理论的件数。",
	"调转速之前，先量出这条线现在每分钟过多少件。",
]
icon = "create:speedometer"
shape = "rsquare"
deps = ["lg_belt_line"]
tasks = [
	{ type = "item", item = "create:speedometer", count = 2 },
]

[[quest]]
name = "lg_branch_merge"
title = "岔路与合流"
desc = [
	"两条带汇进一条时，接缝处会抢道，件数掉得比预期的多。",
	"分流也一样：岔口越靠前，后面的带越不容易压满。",
]
icon = "create:andesite_tunnel"
shape = "rsquare"
deps = ["lg_belt_line"]
tasks = [
	{ type = "item", item = "create:andesite_tunnel", count = 2 },
	{ type = "item", item = "create:brass_tunnel", count = 2 },
]

[[quest]]
name = "lg_riser"
title = "跨层提升"
desc = [
	"物料跨楼层走，靠一段倾斜带或一个锁链传动轮拉上去。",
	"接缝处的取放位置差一格，整段的吞吐就折半。",
]
icon = "create:chain_conveyor"
shape = "rsquare"
deps = ["lg_belt_line"]
tasks = [
	{ type = "item", item = "create:chain_conveyor", count = 2 },
]

[[quest]]
name = "lg_zero_power"
title = "不耗动力的落差搬运"
desc = [
	"上下楼层的大宗料，用落差省掉一段动力带。",
	"代价是节拍由重力决定，接料口压满就会回流。",
]
icon = "create:chute"
shape = "rsquare"
deps = ["lg_belt_line"]
tasks = [
	{ type = "item", item = "create:chute", count = 8 },
]

[[quest]]
name = "lg_gate"
title = "流向开关"
desc = [
	"一条线要按需求开停，而不是一直转着空跑。",
	"开关装在主线的一段上，整段的件数一起被限住。",
]
icon = "create:clutch"
shape = "circle"
size = 1.2
deps = ["lg_belt_line"]
tasks = [
	{ type = "item", item = "create:clutch", count = 2 },
]

[[quest]]
name = "lg_demand"
title = "按需求取料"
desc = [
	"取料口按一个固定件数取，多取的部分等于白搬一趟。",
	"定量投放是这一环的执行件：数量写死，节拍才稳。",
]
icon = "create:weighted_ejector"
shape = "circle"
size = 1.2
deps = ["lg_belt_line"]
tasks = [
	{ type = "item", item = "create:weighted_ejector", count = 2 },
]

[[quest]]
name = "lg_buffer"
title = "中间仓位"
desc = [
	"工段之间留一格缓冲，上游短暂停顿时下游不用跟着停。",
	"缓冲太小等于没有，太大则会把堵塞藏起来。",
]
icon = "create:item_vault"
shape = "circle"
size = 1.2
deps = ["lg_belt_line"]
tasks = [
	{ type = "item", item = "create:item_vault", count = 2 },
]

[[quest]]
name = "lg_line_done"
title = "全线的件数定下来"
desc = [
	"主干带路、提升、缓冲都定了：这条线每分钟过多少件是个已知数。",
	"后面的分流与投递都按这个数来配。",
]
icon = "create:belt_connector"
shape = "octagon"
size = 1.75
deps = ["lg_belt_speed", "lg_branch_merge", "lg_riser", "lg_zero_power",
        "lg_gate", "lg_demand", "lg_buffer"]
tasks = [
	{ type = "item", item = "create:belt_connector", count = 32 },
]

