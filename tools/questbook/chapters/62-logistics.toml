	{ type = "toast" },
]

[[quest]]
name = "lg_tempo_measure"
title = "测出节拍"
desc = [
	"空转的带上没有件数：必须让料真的走过去才算测到。",
	"先量一段，再乘段数，别用估的。",
]
icon = "create:speedometer"
shape = "rsquare"
deps = ["lg_tempo_head"]
tasks = [
	{ type = "item", item = "create:speedometer", count = 2 },
]

[[quest]]
name = "lg_tempo_buffer"
title = "节拍与缓存"
desc = [
	"上下游节拍不一致时，用缓存吸收差值，而不是让两边都降速。",
	"缓存放在最慢那一段的前面，效果最明显。",
]
icon = "create:item_vault"
shape = "circle"
size = 1.2
deps = ["lg_tempo_measure"]
tasks = [
	{ type = "item", item = "create:item_vault", count = 4 },
]

[[quest]]
name = "lg_tempo_read"
title = "线边读数"
desc = [
	"箱里现在有多少，直接从机器上读，不用开箱看。",
	"读数是判断「这段是不是在堵」最省事的办法。",
]
icon = "create:content_observer"
shape = "circle"
size = 1.2
deps = ["lg_tempo_measure"]
tasks = [
	{ type = "item", item = "create:content_observer", count = 4 },
]

[[quest]]
name = "lg_handover"
title = "上下游交接"
desc = [
	"两段线之间的交接处，是整条线上最容易丢件数的地方。",
	"把交接改成有仓库中转，丢件就变成看得见的账。",
]
icon = "create:item_hatch"
shape = "circle"
size = 1.2
deps = ["lg_tempo_buffer"]
tasks = [
	{ type = "item", item = "create:item_hatch", count = 4 },
]

[[quest]]
name = "lg_logistics_done"
title = "整线吞吐达标"
desc = [
	"从原料进来到成品到工位，全程没有人搬东西，且件数可测。",
	"做到这一步，产线的瓶颈才从「人」变成「某一台机器」。",
]
icon = "create:mechanical_arm"
shape = "hexagon"
size = 2.5
deps = ["lg_delivery_done", "lg_stock_done", "lg_tempo_measure", "lg_tempo_buffer",
        "lg_tempo_read", "lg_handover"]
tasks = [
	{ type = "item", item = "create:mechanical_arm", count = 8 },
	{ type = "item", item = "create:brass_tunnel", count = 8 },
	{ type = "item", item = "create:belt_connector", count = 32 },
]
rewards = [
	{ type = "xp", xp = 100 },
	{ type = "toast" },
]
