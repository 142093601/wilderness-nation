[[quest]]
name = "dc_dye_industrial"
title = "染料进车间"
desc = [
	"桶装染料与染色件是同一条线：桶是原料，件是产出。",
	"这一步做完，配色就从手工活变成一道工序。",
]
icon = "create_dragons_plus:dragon_breath_bucket"
shape = "circle"
size = 1.2
deps = ["dc_palette_wide"]
tasks = [
	{ type = "item", item = "create_dragons_plus:dragon_breath_bucket", count = 2 },
	{ type = "item", item = "create_dragons_plus:white_dye_bucket", count = 2 },
]

[[quest]]
name = "dc_horsepower"
title = "畜力上料"
desc = [
	"Create Horsepower：厂区里唯一一种不吃燃料的动力。",
	"它带不动大机器，但适合拖一段附属的传送或磨盘。",
]
icon = "createhorsepower:horse_crank"
shape = "circle"
size = 1.2
deps = ["dc_plate"]
tasks = [
	{ type = "item", item = "createhorsepower:horse_crank", count = 1 },
]

[[quest]]
name = "dc_pipe_run"
title = "管网走线"
desc = [
	"管不必笔直：沿墙、跨梁、下穿地面，走线定了再铺。",
	"先把主管走完，再分枝——反过来的话每分一支都要拆一次。",
]
icon = "create:fluid_pipe"
shape = "rsquare"
deps = ["dc_fluid_hatch"]
tasks = [
	{ type = "item", item = "create:fluid_pipe", count = 32 },
	{ type = "item", item = "create:fluid_valve", count = 4 },
]

[[quest]]
name = "dc_facade"
title = "厂房正立面"
desc = [
	"厂房好不好看，九成在正立面：面材、窗、招牌三者对齐。",
	"先立一面，成了再照抄到其余三面。",
]
icon = "createframed:cardboard_window"
shape = "octagon"
size = 1.75
deps = ["dc_window_kit", "dc_cardboard_window", "dc_label", "dc_boiler"]
tasks = [
	{ type = "item", item = "createframed:cardboard_window", count = 16 },
	{ type = "item", item = "dndecor:text_plate", count = 4 },
]

[[quest]]
name = "dc_workshop"
title = "一座完整的车间"
desc = [
	"面材、梁柱、窗、管网、灯、标线与栈桥，一次全部用上。",
	"做完这一条，厂区就不再是「机器摆在空地上」。",
]
icon = "dndecor:industrial_plating_block"
shape = "octagon"
size = 1.75
deps = ["dc_catwalk_run", "dc_facade", "dc_dye_industrial", "dc_pipe_run"]
tasks = [
	{ type = "item", item = "dndecor:industrial_plating_block", count = 64 },
	{ type = "item", item = "dndecor:large_metal_girder", count = 16 },
	{ type = "item", item = "dndecor:industrial_lamp", count = 8 },
]

[[quest]]
name = "dc_decor_done"
title = "厂区成套"
desc = [
	"从一块面材到一整座车间，材料、配色与走线是同一套。",
	"公共工程与大剧院都按这套做法复制。",
]
icon = "createframed:tinted_framed_glass"
shape = "hexagon"
size = 2.5
deps = ["dc_catwalk_run", "dc_workshop", "dc_palette_wide", "dc_facade",
        "dc_girder", "dc_pipe_run", "dc_hypertube_end"]
tasks = [
	{ type = "item", item = "dndecor:industrial_plating_block", count = 64 },
	{ type = "item", item = "createframed:tinted_framed_glass", count = 32 },
	{ type = "item", item = "dndecor:industrial_catwalk", count = 32 },
]
rewards = [
	{ type = "xp", xp = 100 },
	{ type = "toast" },
]
