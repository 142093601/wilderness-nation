# 技艺 · 机械动力·建材与装饰
#
# 本章的 mod（逐个核对过：`python tools/item_index.py --ns <ns>`）：
#   · Create: Design n' Decor `dndecor`（848 项：金属板 / 格栅 / 支撑 / 高架台 / 锅炉 /
#     灯具 / 螺栓 / 染色彩装 / 切制石料 · 也是 Copycats 的底面）
#   · Create: Framed `createframed`（559 项：嵌框玻璃 / 染色嵌框玻璃 / 网格玻璃 / 纸板窗 /
#     带颜色的包裹与纸板块 / 海带板）
#   · Slice & Dice `sliceanddice`（6 项：切割器 / 洒水器 / 液体肥料）
#   · Create: Dragons Plus `create_dragons_plus`（112 项：染料桶 / 龙息 / 易碎流体储罐 / 流体舱口）
#   · Create: Hypertube `create_hypertube`（10 项：超级管道 / 入口 / 加速 / 接头 / 扫描器）
#   · Create Horsepower `createhorsepower`（1 项：畜力曲柄）
#
# **不在本章的（按 ROSTER §4.1 与任务书口径）**：
#   · `copycats` / `rechiseledcreate` → 归 `100-cat-building`（那章已有伪装方块与机械雕刻）
#   · `tfmg`（Create: The Factory Must Grow）→ 归 `42-materials`
#   · `create:railway` / `createrailwaysnavigator` → 归 `75-steam`
#   · Create 本体的机器与物流件 → 归 `60-create` / `62-logistics`
#
# 与其它章的分工：
#   · `100-cat-building` = **通用结构构件**（门窗、桥、路、栅栏、雕刻变体、框架方块）
#   · `64`（本章）       = **机械动力系的建材**：让厂房、管线与栈桥看起来是同一套东西做的
#
# 判据：全是实物 —— 这类 mod 的价值就是提供方块，判据自然是持有它们。**checkmark = 0**。
#
# 条数：42（簇 1 金属建材 7 · 簇 2 嵌框与伪装 7 · 簇 3 切割件 8 ·
#            簇 4 工业装饰 11 · 簇 5 成组搭配 9）。形状：五边形 5（每簇头一条）·
# 八边形 3 · 六边形 1（终局，放最后）。

key = "create_decor"
title = "机械动力·建材与装饰"
subtitle = "把厂房、管线和栈桥做成同一套东西"
group = "craft"
icon = "dndecor:industrial_plating_block"
order_index = 33

grid = { step = 1.5, row_h = 1.75 }

