# 类目 · 家具与生活
#
# 本章的 mod：Handcrafted · Refurbished Furniture · Macaw's Furniture · Another Furniture ·
#             Supplementaries（摆件）· Immersive Paintings · 花盆/书架一类起居件
#
# 与「建筑与装饰」的分工：那一章管**结构**（桥、窗、门面、材质），
# 这一章管**进屋之后**（坐、睡、收纳、摆件）。

key = "cat_furniture"
title = "家具与生活"
subtitle = "房子盖好之后：让它住得下人"
group = "category"
icon = "handcrafted:acacia_couch"
order_index = 31

grid = { step = 1.5, row_h = 1.75 }

# ---------------- 簇 1：起居（坐 / 睡 / 收纳） ----------------

[[quest]]
name = "f_seating"
title = "座位"
desc = [
	"沙发、长凳、椅子。站着说话的议事厅不是议事厅。",
]
icon = "handcrafted:acacia_couch"
shape = "pentagon"
size = 2.0
tasks = [
	{ type = "item", item = "handcrafted:acacia_couch", count = 4 },
	{ type = "item", item = "handcrafted:acacia_dining_bench", count = 4 },
]

[[quest]]
name = "f_storage_furniture"
title = "柜与抽屉"
desc = [
	"Macaw's Furniture 的柜体：室内收纳不该全靠木箱。",
]
icon = "mcwfurnitures:acacia_drawer"
shape = "rsquare"
deps = ["f_seating"]
tasks = [
	{ type = "item", item = "mcwfurnitures:acacia_drawer", count = 4 },
]

[[quest]]
name = "f_bed"
title = "像样的床"
desc = [
	"各风格床具：住得舒服是长期玩下去的一部分。",
]
icon = "handcrafted:acacia_fancy_bed"
shape = "circle"
size = 1.2
deps = ["f_seating"]
tasks = [
	{ type = "item", item = "handcrafted:acacia_fancy_bed" },
]

[[quest]]
name = "f_kitchen_full"
title = "成套厨房"
desc = [
	"台面 + 水槽 + 抽屉：Refurbished 的厨房系列能凑出一间真厨房。",
]
icon = "refurbished_furniture:acacia_kitchen_drawer"
shape = "circle"
size = 1.2
deps = ["f_seating"]
tasks = [
	{ type = "item", item = "refurbished_furniture:acacia_kitchen_drawer", count = 2 },
	{ type = "item", item = "refurbished_furniture:acacia_kitchen_sink" },
]

# ---------------- 簇 2：摆件与装饰 ----------------

[[quest]]
name = "f_plants"
title = "绿植"
desc = [
	"花盆、盆栽：最便宜也最有效的「有人住」信号。",
]
icon = "minecraft:flower_pot"
shape = "rsquare"
deps = ["f_seating"]
tasks = [
	{ type = "item", item = "minecraft:flower_pot", count = 8 },
]

[[quest]]
name = "f_lamps"
title = "落地灯与吊灯"
desc = [
	"室内照明换个层次：不再只有天花板上一排火把。",
]
icon = "another_furniture:acacia_chair"
shape = "circle"
size = 1.2
deps = ["f_seating"]
tasks = [
	{ type = "item", item = "another_furniture:acacia_chair", count = 4 },
]

[[quest]]
name = "f_supplementaries"
title = "摆件与机械小物"
desc = [
	"Supplementaries 那一堆「没什么用但很好看」的东西：招牌、挂饰、机关。",
	"这类 mod 的价值就是让细节不靠 mod 数量堆出来。",
]
icon = "supplementaries:globe"
shape = "rsquare"
deps = ["f_plants"]
tasks = [
	{ type = "item", item = "supplementaries:globe" },
]

[[quest]]
name = "f_pictures"
title = "把照片挂起来"
desc = [
	"Exposure 拍照 + Immersive Paintings 上墙：把「这一局发生过什么」变成墙上的画。",
	"这条对应设计里「国史 / 碑林」的日常化版本。",
]
icon = "minecraft:item_frame"
shape = "circle"
size = 1.2
deps = ["f_supplementaries"]
tasks = [
	{ type = "item", item = "minecraft:item_frame", count = 8 },
]

# ---------------- 簇 3：起居配套 ----------------

[[quest]]
name = "f_bookshelf_deco"
title = "书架与书房"
desc = [
	"密集书架墙：档案、国史、闲书都该有地方放。",
]
icon = "minecraft:bookshelf"
shape = "circle"
size = 1.2
deps = ["f_storage_furniture"]
tasks = [
	{ type = "item", item = "minecraft:bookshelf", count = 16 },
]

[[quest]]
name = "f_carpet"
title = "地面"
desc = [
	"地毯与地板：一块空地铺上东西，才算「房间」。",
]
icon = "minecraft:white_carpet"
shape = "circle"
size = 1.2
deps = ["f_storage_furniture"]
tasks = [
	{ type = "item", item = "minecraft:white_carpet", count = 16 },
]

[[quest]]
name = "f_completed_room"
title = "装完一间能住人的屋子"
desc = [
	"坐具、床、收纳、照明、绿植、上墙的画——凑齐这六样。",
]
icon = "minecraft:white_bed"
shape = "hexagon"
size = 2.5
deps = ["f_storage_furniture", "f_bed", "f_kitchen_full", "f_lamps", "f_pictures",
        "f_bookshelf_deco", "f_carpet"]
tasks = [
	{ type = "item", item = "minecraft:white_bed" },
]
rewards = [
	{ type = "xp", xp = 60 },
	{ type = "toast" },
]
