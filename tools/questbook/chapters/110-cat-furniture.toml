# 类目 · 家具与生活
#
# 本章的 mod：Macaw's Furniture(mcwfurnitures，柜/桌/椅/床/书架/衣柜) ·
#             Another Furniture(椅/凳/沙发/窗帘/棚/钟) · MrCrayfish Refurbished(厨卫家电) ·
#             Handcrafted(手作家具、战利品、上墙的画) · Supplementaries(摆件)
#
# 与「建筑构件」的分工：那一章管**结构**（桥、窗、门面、材质、墙），
# 这一章管**进屋之后**（坐、睡、收纳、做饭、洗漱、摆件）。
# 与「装饰与细节」的分工：摆件与画面在这里只作为「房间的一部分」出现，
# 单件装饰的玩法归那一章。

key = "cat_furniture"
title = "家具"
subtitle = "屋子盖好之后：把它做成能住人的家"
group = "category"
icon = "handcrafted:acacia_couch"
order_index = 52

grid = { step = 1.5, row_h = 1.75 }

