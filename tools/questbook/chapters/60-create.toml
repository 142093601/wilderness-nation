# 机械动力（技艺章 · 大件 mod 独立成章）
#
# 设计依据
# --------
# PLAN-questbook.md §2.3：技艺章「章副标题写一句这章怎么走；章内第一条是从哪开始的锚点任务；
# 之后按**真实的机器/物品先后关系**铺树（依赖箭头就是路线图）」。
#
# PLAN-questbook.md 根本约束 4：**不重复 mod 自己的教学**。
# Create 自带 Ponder（每个方块都有动画说明），所以这一章：
#   ✗ 不讲"这台机器怎么用"（那是 Ponder 的活）
#   ✓ 只讲"先做哪台、为什么、它在流程里的位置"
#
# 判据来源（均已实测）：
#   · Create 的真实 advancement（`create:hand_crank_000` 等，共 1150 条，其中
#     `create:recipes/*` 是配方解锁、不是游戏内进度，**不能当判据**）
#   · 没有对应进度的条目一律用 `item`（与 ATM10 的写法一致）
#
# 布局：手工紧凑网格（列宽 2.0 / 行高 2.0）。ATM10 的 Create 章 90 任务只占
# 16.5×19 的坐标范围，而我们原来 15 个任务就散到 5.8×12.3 —— 稀疏。
# 自动布局会把几乎每条都放到新的一行，任务一多就变成一堵高墙，所以这里显式给 x/y。

key = "create"
title = "机械动力"
subtitle = "从手摇开始，一路到蒸汽与列车：箭头就是路线图"
group = "craft"
icon = "create:cogwheel"
order_index = 31
grid = { step = 1.5, row_h = 1.75 }


[[quest]]
name = "first_crank"
